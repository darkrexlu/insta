<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Instagram Archive</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#fff;--bg2:#fafafa;--bg3:#efefef;--line:#dbdbdb;--fg:#000;--fg2:#737373;--link:#00376b;
  --blue:#0095f6;--me:#3797f0;--them:#efefef;--themfg:#000;--hover:#f2f2f2;--overlay:rgba(0,0,0,.65);
  --ring:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--navh:50px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--bg2:#121212;--bg3:#262626;--line:#262626;--fg:#f5f5f5;--fg2:#a8a8a8;--link:#e0f1ff;
  --them:#262626;--themfg:#f5f5f5;--hover:#1a1a1a;
}}
:root[data-theme="dark"]{
  --bg:#000;--bg2:#121212;--bg3:#262626;--line:#262626;--fg:#f5f5f5;--fg2:#a8a8a8;--link:#e0f1ff;
  --them:#262626;--themfg:#f5f5f5;--hover:#1a1a1a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:var(--fg)}
svg{display:block}
.app{display:flex;height:100vh;height:100dvh}

/* ---------- sidebar ---------- */
.nav{width:245px;flex:none;border-right:1px solid var(--line);padding:8px 12px 20px;display:flex;flex-direction:column;
  position:relative;z-index:5;background:var(--bg)}
.nav .logo{padding:25px 12px 16px;height:92px}
.nav .logo .word{font-family:"Grand Hotel","Billabong","Segoe Script","Brush Script MT",cursive;font-size:30px;line-height:1}
.nav .logo .glyph{display:none}
.nav a.item,.nav button.item{display:flex;align-items:center;gap:16px;padding:12px;margin:2px 0;border-radius:8px;font-size:16px;width:100%;text-align:left}
.nav .item.on{font-weight:700}
.nav .item svg{width:24px;height:24px;flex:none;transition:transform .15s}
@media (hover:hover){.nav .item:hover{background:var(--hover)}.nav .item:hover svg{transform:scale(1.05)}}
.nav .spacer{flex:1}
.nav.compact{width:73px}
.nav.compact .label,.nav.compact .logo .word{display:none}
.nav.compact .logo .glyph{display:block}
.avatar{border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;
  background:linear-gradient(135deg,#888,#444);text-transform:uppercase;user-select:none}
.ring{padding:2px;border-radius:50%;background:var(--ring);display:inline-block;flex:none}
.ring>.avatar{border:2px solid var(--bg)}
.ring.seen{background:var(--line)}
.morepop{position:fixed;bottom:70px;left:12px;width:266px;max-width:calc(100vw - 16px);background:var(--bg);border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);padding:8px;display:none;z-index:60}
.morepop.open{display:block}
.morepop button,.morepop a{display:flex;gap:12px;align-items:center;padding:14px 16px;width:100%;border-radius:8px;text-align:left}
.morepop svg{width:22px;height:22px}
@media (hover:hover){.morepop button:hover,.morepop a:hover{background:var(--hover)}}
.mtop{display:none}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;min-height:0;position:relative;overscroll-behavior-y:contain}
.center{max-width:935px;margin:0 auto;padding:30px 20px 60px}
h1,h2,h3{margin:0}
.muted{color:var(--fg2)}
.small{font-size:12px}
.btn{background:var(--blue);color:#fff;padding:7px 16px;border-radius:8px;font-weight:600;text-align:center}
.btn.gray{background:var(--bg3);color:var(--fg)}
.btn:hover{filter:brightness(.95)}
.chip{padding:6px 14px;border-radius:8px;background:var(--bg3);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg)}

/* home */
.home{display:flex;justify-content:center;gap:64px;padding:22px 20px 60px}
.feed{width:470px;max-width:100%;min-width:0}
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 0 16px;margin-bottom:12px;scrollbar-width:none;overscroll-behavior-x:contain}
.stories::-webkit-scrollbar{display:none}
.story{width:66px;flex:none;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center}
.story .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;width:100%}
.post{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.post .hd{display:flex;align-items:center;gap:10px;padding:0 4px 12px;min-width:0}
.post .hd>div{min-width:0}
.post .hd b{font-weight:600}
.post .card{border:1px solid var(--line);border-radius:4px;aspect-ratio:1/1;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;padding:32px;gap:16px;overflow:hidden;position:relative}
.post .card .cap{font-size:18px;line-height:1.35;overflow:hidden;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9}
.post .card img,.post .card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.post .acts{display:flex;gap:16px;padding:10px 0 6px}
.post .acts svg{width:24px;height:24px}
.post .cap2{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;line-height:1.4;max-height:5.6em;overflow:hidden}
.post .cap2.open{max-height:none}
.side{width:320px;padding-top:30px}
.side .me{display:flex;gap:12px;align-items:center;margin-bottom:24px}
.side h4{margin:0 0 10px;color:var(--fg2);font-size:14px}
.side .sug{display:flex;gap:12px;align-items:center;padding:8px 0}
.side .sug .tx{flex:1;min-width:0}
.side .sug .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{color:var(--fg2);font-size:12px;margin-top:30px;line-height:1.6}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{aspect-ratio:1/1;position:relative;background:var(--bg3);overflow:hidden;cursor:pointer;min-width:0}
.tile.tall{aspect-ratio:3/4}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .badge{position:absolute;top:8px;right:8px;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.tile .hov{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;gap:6px;transition:opacity .1s;padding:10px;text-align:center}
@media (hover:hover){.tile:hover .hov{opacity:1}}
.ptile{display:flex;flex-direction:column;justify-content:center;padding:14px;gap:6px;text-align:center;color:#111}
.ptile .pc{overflow:hidden;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;line-height:1.35}
.ptile b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sentinel{height:40px}
.gload{opacity:.4}
.gfail{opacity:.25}
.tile video:not([src]){background:#222}
.signin{max-width:380px;margin:12vh auto;padding:40px 32px;border:1px solid var(--line);border-radius:4px;text-align:center;display:flex;flex-direction:column;gap:16px}
.signin .word{font-family:"Grand Hotel","Billabong","Segoe Script","Brush Script MT",cursive;font-size:44px}
.signin input{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}

/* reels */
.reels{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 0;position:relative}
.reel .vid{height:100%;aspect-ratio:9/16;max-width:calc(100% - 100px);background:#000;border-radius:8px;overflow:hidden;position:relative;cursor:pointer}
.reel video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.reel .meta{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 20px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.reel .meta a{pointer-events:auto}
.reel .rmute{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;z-index:2}
.reel .rmute svg{width:18px;height:18px}
.reel .rplay{position:absolute;inset:0;display:none;place-items:center;color:#fff;pointer-events:none;z-index:1}
.reel.paused .rplay{display:grid}
.reel .rplay svg{width:72px;height:72px;opacity:.85;filter:drop-shadow(0 0 8px rgba(0,0,0,.5))}
.reel .rbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);z-index:2;pointer-events:none}
.reel .rbar i{display:block;height:100%;width:0;background:#fff}
.reel .rspin{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.reel .vid:has(video.gload) .rspin{display:grid}
.reel .side-acts{display:flex;flex-direction:column;gap:20px;align-self:flex-end;padding-bottom:20px;align-items:center;font-size:12px}
.reel .side-acts svg{width:26px;height:26px}

/* ---------- DMs ---------- */
.dm{display:flex;height:100%}
.threads{width:397px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.threads .top{padding:36px 24px 12px}
.threads .top h2{font-size:20px;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.threads .tabs{display:flex;gap:22px;padding:8px 24px 6px;flex-wrap:wrap}
.threads .tabs button{font-weight:700;font-size:16px;padding:6px 0;color:var(--fg2)}
.threads .tabs button.on{color:var(--fg)}
.searchbox{background:var(--bg3);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;height:40px}
.searchbox input{flex:1;border:0;background:none;outline:none;min-width:0;-webkit-appearance:none;appearance:none}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none}
.threads .list{overflow-y:auto;overflow-x:hidden;flex:1;overscroll-behavior:contain}
.th{display:flex;gap:12px;align-items:center;padding:8px 24px;cursor:pointer}
@media (hover:hover){.th:hover{background:var(--hover)}}
.th.on{background:var(--bg3)}
.th .tx{flex:1;min-width:0}
.th .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .pv{color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden}
.chat .hd{height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:none}
.chat .hd .tt{flex:1;min-width:0}
.chat .hd .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .hd .ic{padding:8px;flex:none}
.chat .hd svg{width:24px;height:24px}
.back-m{display:none!important}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 8px;overflow-anchor:none;overscroll-behavior:contain}
.intro{text-align:center;padding:30px 0 40px}
.intro .avatar{margin:0 auto 12px}
.ts{text-align:center;color:var(--fg2);font-size:12px;margin:18px 0 10px;font-weight:600}
.row{display:flex;align-items:flex-end;gap:8px;margin:1px 0}
.row.me{justify-content:flex-end}
.row .av{width:28px;flex:none}
.bwrap{max-width:min(564px,70%);display:flex;flex-direction:column;align-items:flex-start;position:relative;min-width:0}
.row.me .bwrap{align-items:flex-end}
.sender{font-size:12px;color:var(--fg2);margin:8px 12px 2px}
.bubble{padding:8px 12px;border-radius:18px;background:var(--them);color:var(--themfg);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;line-height:1.35;font-size:15px;max-width:100%}
.row.me .bubble{background:var(--me);color:#fff}
.bubble.emoji{background:none!important;font-size:40px;padding:0 2px;line-height:1.15}
.row:not(.first) .bubble{border-top-left-radius:4px}
.row:not(.last) .bubble{border-bottom-left-radius:4px}
.row.me:not(.first) .bubble{border-top-left-radius:18px;border-top-right-radius:4px}
.row.me:not(.last) .bubble{border-bottom-left-radius:18px;border-bottom-right-radius:4px}
.row.first .bubble{border-top-left-radius:18px}
.row.last .bubble{border-bottom-left-radius:18px}
.row.me.first .bubble{border-top-right-radius:18px}
.row.me.last .bubble{border-bottom-right-radius:18px}
.bubble a{text-decoration:underline}
.mimg{max-width:min(240px,100%);max-height:320px;border-radius:18px;display:block;cursor:pointer;background:var(--bg3);min-width:60px;min-height:60px;object-fit:cover}
.mvid{max-width:min(260px,100%);max-height:360px;border-radius:18px;display:block;background:#000}
audio{height:40px;max-width:min(260px,100%)}
.share{width:230px;max-width:100%;border-radius:18px;overflow:hidden;background:var(--them);color:var(--themfg);display:block}
.share .sh{display:flex;gap:8px;align-items:center;padding:10px 12px;font-weight:600;font-size:13px;min-width:0}
.share .sb{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;
  background:linear-gradient(160deg,#405de6,#833ab4 40%,#e1306c 75%,#fd1d1d);color:#fff;font-size:14px;line-height:1.35;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.share .sb.gif{padding:0;background:var(--bg3)}
.share .sb.gif img{width:100%;height:100%;object-fit:cover}
.share .sf{padding:8px 12px;font-size:12px;color:var(--fg2)}
.reacts{display:flex;gap:1px;background:var(--bg3);border:2px solid var(--bg);border-radius:12px;padding:1px 5px;font-size:13px;margin-top:-6px;
  position:relative;z-index:1;cursor:default;margin-left:8px}
.row.me .reacts{margin-right:8px}
.reacts span.n{color:var(--fg2);font-size:12px;margin-left:3px}
.sys{text-align:center;color:var(--fg2);font-size:12px;margin:10px 0;display:flex;justify-content:center}
.sys span{display:flex;gap:6px;align-items:center;background:var(--bg3);padding:6px 12px;border-radius:14px}
.unav{font-style:italic;opacity:.8}
.mtime{display:none;font-size:11px;color:var(--fg2);align-self:center;white-space:nowrap}
.row.showtime .mtime{display:block}
@media (hover:hover){.row:hover .mtime{display:block}}
.flash .bubble,.flash .mimg,.flash .share{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px #ffcc00}100%{box-shadow:none}}
mark{background:#ffe066;color:#000;border-radius:3px}
.composer{margin:8px 16px 16px;border:1px solid var(--line);border-radius:22px;height:44px;display:flex;align-items:center;padding:0 14px;gap:10px;color:var(--fg2);flex:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.empty .big{width:96px;height:96px;border:2px solid var(--fg);border-radius:50%;display:grid;place-items:center}
.drawer{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:100%;background:var(--bg);border-left:1px solid var(--line);z-index:20;
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer .dh{height:75px;display:flex;align-items:center;padding:0 16px;font-size:18px;font-weight:700;border-bottom:1px solid var(--line);gap:10px;flex:none}
.drawer .db{overflow-y:auto;flex:1;padding:16px;overscroll-behavior:contain}
.drawer .grid{gap:2px}
.res{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px;word-break:break-word}
@media (hover:hover){.res:hover{background:var(--hover)}}
.loading{display:flex;align-items:center;justify-content:center;flex:1;color:var(--fg2);gap:10px;min-height:120px}
main>.loading{height:100%}
.spin{width:22px;height:22px;border:3px solid var(--bg3);border-top-color:var(--fg2);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* profile */
.prof{display:flex;gap:80px;padding:10px 40px 40px;align-items:center}
.prof .info{display:flex;flex-direction:column;gap:18px;min-width:0}
.prof .uname{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prof .uname h2{font-size:20px;font-weight:400;word-break:break-word}
.prof .pbtns{display:flex;gap:8px;flex-wrap:wrap}
.prof .stats{display:flex;gap:40px;font-size:16px}
.prof .stats b{font-weight:600}
.prof .bio{word-break:break-word}
.ptabs{border-top:1px solid var(--line);display:flex;justify-content:center;gap:60px}
.ptabs button{display:flex;gap:6px;align-items:center;justify-content:center;padding:16px 0;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--fg2);border-top:1px solid transparent;margin-top:-1px;text-transform:uppercase}
.ptabs button.on{color:var(--fg);border-top-color:var(--fg)}
.ptabs svg{width:12px;height:12px}
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.coll .c{aspect-ratio:1/1;border-radius:8px;background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;display:flex;align-items:flex-end;padding:14px;font-size:16px;font-weight:600;cursor:pointer;min-width:0;word-break:break-word}

/* generic pages */
.plist a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:8px}
.plist a>div{min-width:0}
.plist a>span:last-child{flex:none}
@media (hover:hover){.plist a:hover{background:var(--hover)}}
.sec{margin:26px 0 8px;font-weight:700;font-size:16px}
.gblock{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--bg);min-width:0}
.gblock .gblock{border:0;padding:6px 0 0 12px;margin:6px 0 0;border-left:2px solid var(--line);border-radius:0}
.gt{font-weight:600;margin-bottom:6px;word-break:break-word}
.kv{display:grid;grid-template-columns:minmax(110px,200px) minmax(0,1fr);gap:4px 16px;padding:3px 0}
.kv .k{color:var(--fg2)}
.kv .v{word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.kv .v a,.lnk{color:var(--blue)}
.gdate{color:var(--fg2);font-size:12px;margin-top:6px}
.gmedia img,.gmedia video{max-width:min(240px,100%);max-height:240px;border-radius:8px;margin:4px 4px 0 0;cursor:pointer}

/* panels (search / notifications) */
.panel{position:fixed;left:73px;top:0;bottom:0;width:397px;background:var(--bg);border-right:1px solid var(--line);border-radius:0 16px 16px 0;
  box-shadow:4px 0 24px rgba(0,0,0,.15);z-index:4;display:flex;flex-direction:column;transform:translateX(-110%);transition:transform .25s;visibility:hidden}
.panel.open{transform:none;visibility:visible}
.panel .ph{padding:24px 24px 12px}
.panel .phr{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.panel .ph h2{font-size:24px}
.panel .pclose{display:none;margin-left:auto;font-size:30px;line-height:1;padding:0 6px}
.panel .pb{overflow-y:auto;flex:1;border-top:1px solid var(--line);padding:12px 0;overscroll-behavior:contain}
.panel .it{display:flex;gap:12px;padding:8px 24px;align-items:center;cursor:pointer}
@media (hover:hover){.panel .it:hover{background:var(--hover)}}
.panel .it .tx{flex:1;min-width:0;line-height:1.35;word-break:break-word}
.panel h4{padding:8px 24px;margin:0}

/* lightbox */
.lb{position:fixed;inset:0;background:var(--overlay);z-index:100;display:none;align-items:center;justify-content:center;touch-action:pan-y pinch-zoom}
.lb.open{display:flex}
.lb .box{max-width:92vw;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;align-items:center;gap:10px}
.lb img,.lb video{max-width:92vw;max-height:84vh;max-height:84dvh;border-radius:4px;background:#000;min-width:80px;min-height:80px;object-fit:contain}
.lb .cap{color:#fff;font-size:13px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.lb .cap a{text-decoration:underline}
.lb .x{position:fixed;top:calc(14px + var(--sat));right:20px;color:#fff;font-size:32px;width:44px;height:44px;display:grid;place-items:center;z-index:2}

// ---------------- helpers
const seg=window.Intl&&Intl.Segmenter?new Intl.Segmenter():null;
function graphemes(s){return seg?[...seg.segment(s)].map(x=>x.segment):[...s];}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.codePointAt(0))%360;return h;}
function initials(name){
  // strip leading punctuation/underscores but keep any letter, digit or emoji (\W alone would drop "É", Arabic, CJK…)
  const g=graphemes(String(name||'?').replace(/^[^\p{L}\p{N}\p{Extended_Pictographic}]+/u,'')||'?');
  return esc(g[0]||'?');
}
function avatar(name,size=44,ring=false,seen=false){
  const h=hue(name);
  const a=`<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px;background:linear-gradient(135deg,hsl(${h} 70% 58%),hsl(${(h+50)%360} 65% 42%))">${initials(name)}</div>`;
  return ring?`<span class="ring${seen?' seen':''}">${a}</span>`:a;
}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function d(ts){if(!ts)return null;const x=new Date(ts);return isNaN(x)?null:x;}
function fmtTime(ts){const x=d(ts);if(!x)return'';let h=x.getHours(),m=String(x.getMinutes()).padStart(2,'0');const ap=h>=12?'PM':'AM';h=h%12||12;return`${h}:${m} ${ap}`}
function fmtDay(ts){const x=d(ts);if(!x)return'';return`${MONTHS[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`}
function fmtStamp(ts){return d(ts)?`${fmtDay(ts)}, ${fmtTime(ts)}`:''}
function ago(ts){
  const x=d(ts);if(!x)return'';const ref=d(IDX&&IDX.generated)||new Date();
  const s=(ref-x)/1000;if(s<3600)return Math.max(1,Math.round(s/60))+'m';if(s<86400)return Math.round(s/3600)+'h';
  if(s<604800)return Math.round(s/86400)+'d';if(s<31536000)return Math.round(s/604800)+'w';return Math.round(s/31536000)+'y';
}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');}
function isEmojiOnly(t){if(!t||t.length>16)return false;return /^(\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s)+$/u.test(t)&&/\p{Extended_Pictographic}/u.test(t)&&!/[0-9#*]/.test(t);}
function mediaSrc(src){return encodeURI(src).replace(/#/g,'%23');}
async function getChat(id){return loadData('chat:'+id,'viewer_data/chats/'+id+'.js');}
const chatById={};
function others(c){return ((c&&c.people)||[]).filter(p=>p!==ME&&p!=='Meta AI');}
function chatName(c){
  if(!c)return 'Instagram User';
  if(c.kind==='ai')return 'Meta AI';
  const o=others(c);
  if(c.title&&c.title!=='Instagram User'&&c.title!==ME)return c.title;
  if(o.length&&o.some(x=>x!=='Instagram User'))return o.filter(x=>x!=='Instagram User').join(', ');
  if(c.title===ME&&!o.length)return ME+' (You)';
  return c.title||'Instagram User';
}
const SYS_RE=/^(Reacted .+ to your message ?|Liked a message)$/;
const CALL_RE=/(started an audio call|started a video chat|call ended|missed an audio call|missed a video chat|video chat ended|joined the (video|audio) call)$/i;

// ---------------- generic page model helpers
function flat(v,acc=[],ctx=''){
  if(v==null)return acc;
  if(typeof v==='string'){acc.push([ctx,v]);return acc;}
  if(v.rows)v.rows.forEach(([k,val])=>{if(typeof val==='string')acc.push([k,val]);else if(val&&val.link)acc.push([k,val.link]);else flat(val,acc,k||ctx);});
  if(v.blocks)v.blocks.forEach(b=>{flat(b.value,acc,b.title||ctx);});
  if(v.link)acc.push([ctx,v.link]);
  if(v.media)v.media.forEach(m=>acc.push(['__media',m]));
  return acc;
}
function pick(arr,key){const r=arr.find(([k])=>k===key);return r?r[1]:'';}
function pickAll(arr,key){return arr.filter(([k])=>k===key).map(r=>r[1]);}
function page(path){return PAGES[path]||{blocks:[]};}
function postItems(path){
  return (page(path).blocks||[]).map(b=>{
    const f=flat(b.value);
    return {url:pick(f,'URL')||'',caption:pick(f,'Caption')||'',owner:pick(f,'Username')||'',name:pick(f,'Name')||'',
      ts:b.ts,date:b.date,tags:pickAll(f,'Hashtags'),media:f.filter(r=>r[0]==='__media').map(r=>r[1])};
  });
}

function maybeLink(url,cls,style,inner){

// ---------------- panels: search & notifications
let panelKind=null;
function closePanel(){panel.classList.remove('open');panelKind=null;++searchToken;renderNav(curView);}
function openPanel(kind){
  if(panelKind===kind){closePanel();return;}
  panelKind=kind;panel.classList.add('open');panel.scrollTop=0;
  morepop.classList.remove('open');
  renderNav(kind);
  if(kind==='search')renderSearchPanel();else renderNotifPanel();
}
function panelHead(title){return `<div class="phr"><h2>${title}</h2><button class="pclose" aria-label="Close">×</button></div>`;}
function bindPanelClose(){const x=panel.querySelector('.pclose');if(x)x.onclick=closePanel;}
function renderSearchPanel(){
  panel.innerHTML=`<div class="ph">${panelHead('Search')}<div class="searchbox">${sized(I.search,16)}<input id="gq" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" placeholder="Search messages and people"></div>
    <div class="small muted" style="margin-top:8px">Searches every message in your archive.</div></div>
    <div class="pb" id="gres"></div>`;
  bindPanelClose();
  searchDefault();
  const inp=$('#gq');setTimeout(()=>inp.focus({preventScroll:true}),50);
  let t;inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>globalSearch(inp.value.trim()),300);};
  inp.onkeydown=e=>{if(e.key==='Enter'){clearTimeout(t);inp.blur();globalSearch(inp.value.trim());}};
}
function searchDefault(){
  const box=$('#gres');if(!box)return;
  const recent=(page(P.searches).blocks||[]).map(b=>({q:pick(flat(b.value),'Search query'),ts:b.ts})).filter(r=>r.q);
  box.innerHTML=`<h4>People</h4>${IDX.chats.slice(0,8).map(c=>personRow(c)).join('')}
    ${recent.length?`<h4 style="margin-top:12px">Recent searches</h4>`+recent.map(r=>`<div class="it" data-q="${esc(r.q)}"><div class="avatar" style="width:44px;height:44px;background:var(--bg3);color:var(--fg)">${sized(I.search,18)}</div><div class="tx">${esc(r.q)}<div class="small muted">${fmtDay(r.ts)}</div></div></div>`).join(''):''}`;
  box.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{$('#gq').value=x.dataset.q;globalSearch(x.dataset.q);});
  bindPersonRows(box);
}
function personRow(c){return `<div class="it" data-chat="${esc(c.id)}">${avatar(chatName(c),44)}<div class="tx"><b>${esc(chatName(c))}</b><div class="small muted">${(c.count||0).toLocaleString()} messages</div></div></div>`;}
function bindPersonRows(r){r.querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>{closePanel();location.hash='#/inbox/'+encodeURIComponent(x.dataset.chat)+(x.dataset.i?'/'+x.dataset.i:'');});}
let searchToken=0;
async function globalSearch(q){
  const box=$('#gres');if(!box)return;const tok=++searchToken;
  if(q.length<2){searchDefault();return;}
  const ql=q.toLowerCase();
  const people=IDX.chats.filter(c=>chatName(c).toLowerCase().includes(ql)||(c.people||[]).some(p=>p.toLowerCase().includes(ql)));
  box.innerHTML=(people.length?'<h4>People</h4>'+people.map(personRow).join(''):'')+'<h4 style="margin-top:8px">Messages</h4><div id="mres"><div class="loading" style="padding:20px"><div class="spin"></div><span id="sprog">Searching…</span></div></div>';
  bindPersonRows(box);
  const hits=[];
  const order=[...IDX.chats].sort((a,b)=>(a.count||0)-(b.count||0));
  for(let k=0;k<order.length;k++){
    const c=order[k];const p=$('#sprog');if(p)p.textContent=`Searching ${chatName(c)}… (${k+1}/${order.length})`;
    let ch;try{ch=await getChat(c.id);}catch(e){continue;}
    if(tok!==searchToken)return;
    (ch.messages||[]).forEach((m,i)=>{const t=m.text||'';if(t&&!SYS_RE.test(t)&&t.toLowerCase().includes(ql))hits.push({c,m,i});});
  }
  hits.sort((a,b)=>byTsDesc(a.m,b.m));
  const mres=$('#mres');if(!mres||tok!==searchToken)return;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  mres.innerHTML=hits.length?`<div class="small muted" style="padding:0 16px 8px">${hits.length.toLocaleString()} results${hits.length>400?' · showing newest 400':''}</div>`+hits.slice(0,400).map(h=>`<div class="it" data-chat="${esc(h.c.id)}" data-i="${h.i}">${avatar(chatName(h.c),36)}<div class="tx"><div class="small"><b>${esc(chatName(h.c))}</b> · <span class="muted">${fmtDay(h.m.ts)}</span></div><div class="small">${h.m.from===ME?'You: ':''}${esc(h.m.text.slice(0,140)).replace(re,s=>`<mark>${s}</mark>`)}</div></div></div>`).join(''):'<div class="muted" style="padding:12px 24px">No messages found.</div>';
  bindPersonRows(mres);
}
function renderNotifPanel(){
  const items=[];
  postItems(P.storyLikes).forEach(x=>items.push({ts:x.ts,who:x.owner,txt:`You liked <b>${esc(x.owner)}</b>'s story.${x.caption?' “'+esc(x.caption.slice(0,60))+'”':''}`,url:x.url}));
  (page(P.polls).blocks||[]).forEach(b=>{const f=flat(b.value);items.push({ts:b.ts,who:pick(f,'Username')||'poll',txt:`You voted in a poll${pick(f,'Username')?' by <b>'+esc(pick(f,'Username'))+'</b>':''}: ${esc(f.filter(r=>typeof r[1]==='string'&&r[0]!=='Username'&&r[0]!=='URL').map(r=>r[1]).slice(0,2).join(' · '))}`});});
  (page(P.stickers).blocks||[]).forEach(b=>{const f=flat(b.value);items.push({ts:b.ts,who:pick(f,'Username')||'story',txt:`You reacted to a story${pick(f,'Username')?' by <b>'+esc(pick(f,'Username'))+'</b>':''}. ${esc(f.filter(r=>typeof r[1]==='string'&&!['Username','URL','Name'].includes(r[0])).map(r=>r[1]).slice(0,2).join(' · '))}`});});
  postItems(P.liked).forEach(x=>items.push({ts:x.ts,who:x.owner,txt:`You liked a post by <b>${esc(x.owner||'someone')}</b>.${x.caption?' “'+esc(x.caption.slice(0,60))+'…”':''}`,url:x.url}));
  // reactions others left on your messages are inside chats; show latest chat activity
  IDX.chats.slice(0,10).forEach(c=>c.last&&c.last.from!==ME&&items.push({ts:c.last.ts,who:chatName(c),txt:`<b>${esc(chatName(c))}</b> messaged you: ${esc((c.last.text||'').slice(0,60))}`,chat:c.id}));
  items.sort(byTsDesc);
  const groups={};const ref=d(IDX.generated)||new Date();
  items.forEach(it=>{const x=d(it.ts);const days=x?(ref-x)/864e5:1e9;const g=days<7?'This week':days<30?'This month':'Earlier';(groups[g]=groups[g]||[]).push(it);});
  panel.innerHTML=`<div class="ph">${panelHead('Notifications')}<div class="small muted" style="margin-top:-6px">Your story likes, poll votes, liked posts and recent messages.</div></div><div class="pb">`+
    (Object.entries(groups).map(([g,arr])=>`<h4>${g}</h4>`+arr.map(it=>`<div class="it" ${it.chat?`data-chat="${esc(it.chat)}"`:it.url?`data-url="${esc(it.url)}"`:''}>${avatar(it.who,44)}<div class="tx">${it.txt} <span class="muted">${ago(it.ts)}</span></div></div>`).join('')).join('')||'<div class="muted" style="padding:12px 24px">Nothing here yet.</div>')+'</div>';
  bindPanelClose();
  bindPersonRows(panel);
  panel.querySelectorAll('[data-url]').forEach(x=>x.onclick=()=>window.open(x.dataset.url,'_blank','noopener'));
}

// ---------------- lightbox (shared by media viewer and stories; Back button / swipe-down closes it)
let lbList=[],lbI=0,lbNav=null,lbHist=false;
function showLB(html,nav){
  lb.innerHTML=html;lbNav=nav||{};lb.classList.add('open');
  if(!lbHist){try{history.pushState({lb:1},'');lbHist=true;}catch(e){}}
  lb.querySelector('.x').onclick=()=>closeLB();
  const l=lb.querySelector('.ar.l'),r=lb.querySelector('.ar.r');
  if(l)l.onclick=e=>{e.stopPropagation();lbNav.prev&&lbNav.prev();};
  if(r)r.onclick=e=>{e.stopPropagation();lbNav.next&&lbNav.next();};
  // a link inside the lightbox replaces the dummy history entry instead of stacking on top of it
  lb.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=e=>{e.preventDefault();const had=lbHist;lbHist=false;closeLB(true);
    if(had)location.replace(a.getAttribute('href'));else location.hash=a.getAttribute('href');});
}
function closeLB(viaHistory){
  if(!lb.classList.contains('open'))return;
  lb.querySelectorAll('video,audio').forEach(v=>{try{v.pause()}catch(e){}});
  lb.classList.remove('open');lb.innerHTML='';lbNav=null;
  if(lbHist){lbHist=false;if(!viaHistory)history.back();}
}
window.addEventListener('popstate',()=>{if(lbHist){lbHist=false;closeLB(true);}});
function openLB(list,i){lbList=list;lbI=Math.max(0,i);drawLB();}
function drawLB(){
  const it=lbList[lbI];if(!it)return;
  const c=it.chat&&chatById[it.chat];
  showLB(`<button class="x" aria-label="Close">×</button>
    ${lbI>0?'<button class="ar l" aria-label="Previous">‹</button>':''}${lbI<lbList.length-1?'<button class="ar r" aria-label="Next">›</button>':''}
    <div class="box">${it.type==='video'?`<video ${msrc(it.src)} controls autoplay playsinline></video>`:`<img ${msrc(it.src)} alt="">`}
    <div class="cap">${it.from?`<span>${esc(it.from===ME?'You':it.from)}</span>`:''}${it.ts?`<span>${fmtStamp(it.ts)}</span>`:''}
    ${c?`<a href="#/inbox/${encodeURIComponent(c.id)}/src:${encodeURIComponent(it.src)}">Open in chat with ${esc(chatName(c))}</a>`:''}
    <span>${lbI+1} / ${lbList.length}</span></div></div>`,
    {prev:lbI>0?()=>{lbI--;drawLB();}:null,next:lbI<lbList.length-1?()=>{lbI++;drawLB();}:null});
}
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('box'))closeLB();});
let tx0=null,ty0=0;
lb.addEventListener('touchstart',e=>{if(e.touches.length!==1){tx0=null;return;}tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
lb.addEventListener('touchend',e=>{
  if(tx0==null||!lbNav)return;const t=e.changedTouches[0];const dx=t.clientX-tx0,dy=t.clientY-ty0;tx0=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2){const f=dx<0?lbNav.next:lbNav.prev;f&&f();}
  else if(dy>90&&dy>Math.abs(dx))closeLB();
},{passive:true});
document.addEventListener('keydown',e=>{
  if(lb.classList.contains('open')){
    if(e.key==='Escape')closeLB();
    if(e.key==='ArrowLeft'&&lbNav&&lbNav.prev)lbNav.prev();
    if(e.key==='ArrowRight'&&lbNav&&lbNav.next)lbNav.next();
    return;
  }
  if(e.key!=='Escape')return;
  if(morepop.classList.contains('open'))morepop.classList.remove('open');
  else if(panelKind)closePanel();
  else{const dr=$('#drawer');if(dr&&dr.classList.contains('open'))dr.classList.remove('open');}

// ---------------- infinite grid
function infiniteGrid(container,list,tileFn,batch=45,onClick){
  let n=0;const grid=document.createElement('div');grid.className='grid';container.appendChild(grid);
  const sent=document.createElement('div');sent.className='sentinel';container.appendChild(sent);
  const root=container.closest('.db,main');
  function more(){const end=Math.min(list.length,n+batch);let h='';for(;n<end;n++)h+=tileFn(list[n],n);grid.insertAdjacentHTML('beforeend',h);if(n>=list.length){io.disconnect();sent.remove();}}
  const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))more();},{root,rootMargin:'800px 0px'});
  io.observe(sent);more();
  if(onClick)grid.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)onClick(+t.dataset.i);});
}
function mediaTile(w,i){
  return `<div class="tile" data-i="${i}">${w.type==='video'?`<video ${msrc(w.src,1)} preload="metadata" muted playsinline></video><div class="badge">${I.reels.replace('<svg','<svg width="20" height="20" style="stroke:#fff"')}</div>`:`<img ${msrc(w.src)} alt="">`}
    <div class="hov">${esc(w.from===ME?'You':w.from||'')}<br>${fmtDay(w.ts)}</div></div>`;
}
function postTile(p,icon){
  const h=hue((p.owner||'')+(p.url||''));
  return maybeLink(p.url,'tile ptile',`background:linear-gradient(135deg,hsl(${h} 60% 88%),hsl(${(h+60)%360} 60% 75%))`,
    `${p.owner?`<b class="small">@${esc(p.owner)}</b>`:''}<div class="small pc">${esc((p.caption||(/reel/.test(p.url||'')?'Reel':'Post')).slice(0,160))}</div><div class="badge">${icon}</div>`);
}

let reelMuted=true;
function viewReels(){
  const vids=(IDX.wall||[]).filter(w=>w.type==='video');
  main.innerHTML=`<div class="reels" id="rl"></div>`;
  const rl=$('#rl');
  if(!vids.length){rl.innerHTML='<div class="empty" style="height:100%"><h3>No videos</h3></div>';return;}
  const muteIcons=()=>rl.querySelectorAll('.rmute').forEach(b=>b.innerHTML=reelMuted?I.mute:I.sound);
  function playV(v){
    v.muted=reelMuted;
    const p=v.play();
    // autoplay with sound can be refused (mostly iOS): fall back to muted
    if(p)p.catch(()=>{if(!v.muted&&v.src){v.muted=true;reelMuted=true;muteIcons();v.play().catch(()=>{});}});
  }
  let n=0;
  const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;
    if(e.isIntersecting&&e.intersectionRatio>.6){e.target.classList.add('playing');e.target.classList.remove('paused');if(v.src)playV(v);}
    else{e.target.classList.remove('playing');v.pause();}}),{root:rl,threshold:[0,.6,1]});
  function more(){const end=Math.min(vids.length,n+6);for(;n<end;n++){const w=vids[n];const c=chatById[w.chat];
    const el=document.createElement('div');el.className='reel';
    el.innerHTML=`<div class="vid"><video ${msrc(w.src)} loop playsinline muted preload="metadata"></video>
      <div class="rspin"><div class="spin"></div></div><div class="rplay">${I.play}</div>
      <button class="rmute" aria-label="Toggle sound">${reelMuted?I.mute:I.sound}</button>
      <div class="meta"><div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">${avatar(w.from||'?',32)}<b>${esc(w.from===ME?'You':w.from)}</b></div>
      <div class="small">Sent in chat with ${esc(c?chatName(c):'')} · ${fmtDay(w.ts)}</div></div><div class="rbar"><i></i></div></div>
      <div class="side-acts">${I.heart}<span>${n+1}/${vids.length}</span>${c?`<a href="#/inbox/${encodeURIComponent(c.id)}/src:${encodeURIComponent(w.src)}" title="Open in chat" aria-label="Open in chat">${I.comment}</a>`:''}${I.dm}</div>`;
    const v=el.querySelector('video');v._play=()=>playV(v);
    rl.appendChild(el);io.observe(el);}}
  more();
  rl.addEventListener('click',e=>{
    const m=e.target.closest('.rmute');
    if(m){reelMuted=!reelMuted;rl.querySelectorAll('video').forEach(v=>v.muted=reelMuted);muteIcons();
      const pv=m.closest('.reel').querySelector('video');if(!reelMuted&&pv.paused&&pv.src)playV(pv);return;}
    const box=e.target.closest('.vid');if(!box||e.target.closest('a'))return;
    const v=box.querySelector('video'),r=box.closest('.reel');if(!v.src)return;
    if(v.paused){r.classList.remove('paused');playV(v);}else{v.pause();r.classList.add('paused');}
  });
  rl.addEventListener('timeupdate',e=>{const v=e.target;if(!v.duration)return;const b=v.parentNode.querySelector('.rbar i');if(b)b.style.width=(v.currentTime/v.duration*100)+'%';},true);
  rl.onscroll=()=>{if(rl.scrollTop+rl.clientHeight>rl.scrollHeight-rl.clientHeight*2&&n<vids.length)more();};
}

let CH=null; // current chat state
async function openChat(id,focus){
  const box=$('#chat');box.dataset.id=id;
  let c=chatById[id];
  const backBtn=`<a class="ic back-m" href="#/inbox" aria-label="Back">${I.back}</a>`;
  box.innerHTML=`<div class="hd">${backBtn}${avatar(c?chatName(c):id,44)}<div class="tt"><div><b>${esc(c?chatName(c):id)}</b></div><div class="small muted">${c?(c.count||0).toLocaleString()+' messages':''}</div></div></div><div class="loading"><div class="spin"></div>Loading ${c?(c.count||0).toLocaleString():''} messages…</div>`;
  let data;
  try{data=await getChat(id);}catch(e){const l=box.querySelector('.loading');if(l)l.textContent='Could not load this chat.';return;}
  if(box.dataset.id!==id)return;
  if(!c)c={id,title:data.title,people:data.people||[],count:(data.messages||[]).length,kind:data.kind};
  const all=data.messages||[];
  const msgs=all.filter(m=>!(m.text&&SYS_RE.test(m.text)));
  const map=[];all.forEach((m,i)=>{if(!(m.text&&SYS_RE.test(m.text)))map[i]=map.length;});
  const people=others(c.people&&c.people.length?c:data);
  const group=people.length>1;
  CH={id,c,msgs,start:0,end:0,group,origMap:map,stick:!focus};
  box.innerHTML=`<div class="hd">${backBtn}${avatar(chatName(c),44)}<div class="tt"><div><b>${esc(chatName(c))}</b></div><div class="small muted">${group?esc(people.join(', ')):esc(people[0]||'')}</div></div>
    <button class="ic" title="Search in chat" aria-label="Search in chat" id="bsearch">${I.search}</button><button class="ic" title="Jump to date" aria-label="Jump to date" id="bdate">${I.cal}</button><button class="ic" title="Details" aria-label="Details" id="binfo">${I.info}</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">🙂<span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Message… (read-only archive)</span></div>
    <div class="drawer" id="drawer"></div>`;
  $('#binfo').onclick=()=>toggleDrawer('info');
  $('#bsearch').onclick=()=>toggleDrawer('search');
  $('#bdate').onclick=()=>toggleDrawer('date');
  const el=$('#msgs');
  let at=msgs.length-1;
  if(focus){
    if(focus.startsWith('src:')){const s=decodeURIComponent(focus.slice(4));const k=msgs.findIndex(m=>(m.media||[]).some(x=>x.src===s));if(k>=0)at=k;}
    else if(/^\d+$/.test(focus)){const k=map[+focus];if(k!=null)at=k;}
  }
  renderWindow(Math.max(0,at-120),Math.min(msgs.length,at+80));
  if(focus)scrollToMsg(at);else el.scrollTop=el.scrollHeight;
  // keep pinned to the newest message while photos above it finish loading, until the user scrolls
  const unstick=()=>{CH.stick=false;};
  el.addEventListener('wheel',unstick,{passive:true});el.addEventListener('touchstart',unstick,{passive:true});
  el.addEventListener('load',()=>{if(CH&&CH.id===id&&CH.stick)el.scrollTop=el.scrollHeight;},true);
  el.onscroll=()=>{
    if(el.scrollTop<400&&CH.start>0){const h=el.scrollHeight,top=el.scrollTop;renderWindow(Math.max(0,CH.start-150),CH.end);el.scrollTop=top+el.scrollHeight-h;}
    else if(el.scrollTop+el.clientHeight>el.scrollHeight-400&&CH.end<msgs.length){renderWindow(CH.start,Math.min(msgs.length,CH.end+150));}
  };
  el.addEventListener('click',e=>{
    const im=e.target.closest('[data-m]');
    if(!im){
      // tap a message to show its time (no hover on touch screens)
      const row=e.target.closest('.row');if(row&&!e.target.closest('a,video,audio'))row.classList.toggle('showtime');
      return;
    }
    const list=[];let idx=0;
    msgs.forEach((m,mi)=>(m.media||[]).forEach(x=>{if(x.type!=='audio'){if(mi===+im.dataset.m&&x.src===im.dataset.src)idx=list.length;list.push({...x,from:m.from,ts:m.ts});}}));
    openLB(list,idx);
  });
}
function scrollToMsg(i){
  const el=$('#msgs');if(!el)return;
  if(i<CH.start||i>=CH.end)renderWindow(Math.max(0,i-120),Math.min(CH.msgs.length,i+80));
  requestAnimationFrame(()=>{const t=el.querySelector(`[data-mi="${i}"]`);if(t){
    // scroll only the message list (scrollIntoView would also nudge the page on mobile)
    const r=t.getBoundingClientRect(),er=el.getBoundingClientRect();
    el.scrollTop+=r.top-er.top-Math.max(0,(el.clientHeight-r.height)/2);
    t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),1700);}});
}
function renderWindow(s,e){
  if(!$("#msgs"))return;
  CH.start=s;CH.end=e;
  const {msgs,group,c}=CH;const out=[];
  if(s===0)out.push(`<div class="intro">${avatar(chatName(c),96)}<h3 style="font-size:20px">${esc(chatName(c))}</h3><div class="muted">${esc(others(c).join(', '))}</div><div class="muted small" style="margin-top:6px">${msgs.length.toLocaleString()} messages${msgs[0]&&msgs[0].ts?' since '+fmtDay(msgs[0].ts):''}</div></div>`);
  else out.push(`<div class="loading" style="padding:20px"><div class="spin"></div></div>`);
  for(let i=s;i<e;i++){
    const m=msgs[i],p=msgs[i-1],n=msgs[i+1];
    const gap=!p||!m.ts||!p.ts||(new Date(m.ts)-new Date(p.ts))>36e5;
    if(gap&&m.ts)out.push(`<div class="ts">${fmtStamp(m.ts)}</div>`);
    const t=m.text||'';
    if(CALL_RE.test(t)&&!m.media){out.push(`<div class="sys" data-mi="${i}"><span>${/video/i.test(t)?sized(I.video,16):sized(I.phone,16)}${esc(t.replace(/^.*? (started|missed|joined)/,(x,v)=>(m.from===ME?'You ':m.from+' ')+v).replace(/^call ended$/i,'Call ended'))} · ${fmtTime(m.ts)}</span></div>`);continue;}
    const me=m.from===ME;
    const same=(a)=>a&&a.from===m.from&&!(CALL_RE.test(a.text||'')&&!a.media)&&a.ts&&m.ts&&Math.abs(new Date(a.ts)-new Date(m.ts))<36e5;
    const first=!same(p)||gap, last=!same(n)||(n&&n.ts&&m.ts&&(new Date(n.ts)-new Date(m.ts))>36e5);
    let body='';
    const attachTxt=/sent an attachment\.$/.test(t);
    if(m.media)m.media.forEach(x=>{
      if(x.type==='img')body+=`<img class="mimg" data-m="${i}" data-src="${esc(x.src)}" ${msrc(x.src)} alt="">`;
      else if(x.type==='video')body+=`<video class="mvid" ${msrc(x.src)} controls preload="metadata" playsinline></video>`;
      else body+=`<audio ${msrc(x.src)} controls preload="none"></audio>`;
    });
    if(m.share){const sh=m.share;const url=sh.url||'';const gif=/giphy\.com|\.gif(\?|$)/i.test(url);
      const kind=/\/reel\//.test(url)?'Reel':/\/stories\//.test(url)?'Story':gif?'GIF':'Post';
      body+=maybeLink(url,'share','',`${sh.owner?`<div class="sh">${avatar(sh.owner,24)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sh.owner)}</span></div>`:''}
        <div class="sb${gif?' gif':''}">${gif?`<img src="${esc(url)}" loading="lazy" alt="GIF">`:esc((sh.title||'').slice(0,220))||(kind==='GIF'?'Post':kind)}</div>
        <div class="sf">${kind}${url?' · Open on Instagram':''}</div>`);}
    if(t&&!(attachTxt&&(m.share||m.media)))body+=attachTxt?`<div class="bubble unav">${esc(t)}</div>`:`<div class="bubble${isEmojiOnly(t)?' emoji':''}">${linkify(t)}</div>`;
    if(!body)body=`<div class="bubble unav">${m.from?'Message unavailable':''}</div>`;
    let reacts='';
    if(m.reactions&&m.reactions.length){
      const ems=m.reactions.map(r=>{const g=graphemes(String(r));return {e:g[0],who:g.slice(1).join('')};});
      const uniq=[...new Set(ems.map(x=>x.e))];
      reacts=`<div class="reacts" title="${esc(ems.map(x=>x.e+' '+(x.who===ME?'You':x.who)).join('\n'))}">${uniq.map(x=>`<span>${esc(x)}</span>`).join('')}${ems.length>1?`<span class="n">${ems.length}</span>`:''}</div>`;
    }
    out.push(`<div class="row${me?' me':''}${first?' first':''}${last?' last':''}" data-mi="${i}">
      ${me?`<span class="mtime">${fmtTime(m.ts)}</span>`:`<div class="av">${last?avatar(m.from||chatName(c),28):''}</div>`}
      <div class="bwrap">${group&&!me&&first?`<div class="sender">${esc(m.from)}</div>`:''}${body}${reacts}</div>
      ${me?'':`<span class="mtime">${fmtTime(m.ts)}</span>`}</div>`);
  }
  if(e<msgs.length)out.push(`<div class="loading" style="padding:20px"><div class="spin"></div></div>`);
  $('#msgs').innerHTML=out.join('');
}
function toggleDrawer(kind){
  const dr=$('#drawer');
  if(dr.classList.contains('open')&&dr.dataset.k===kind){dr.classList.remove('open');return;}
  dr.dataset.k=kind;dr.classList.add('open');
  const {msgs,c}=CH;
  const close=`<button style="margin-left:auto;font-size:28px;padding:0 6px" id="dclose" aria-label="Close">×</button>`;
  if(kind==='info'){
    const media=[];msgs.forEach((m,mi)=>(m.media||[]).forEach(x=>{if(x.type!=='audio')media.push({...x,from:m.from,ts:m.ts,mi});}));
    const aud=msgs.reduce((a,m)=>a+(m.media||[]).filter(x=>x.type==='audio').length,0);
    const shares=msgs.filter(m=>m.share).length;
    const by={};msgs.forEach(m=>{if(m.from)by[m.from]=(by[m.from]||0)+1;});
    dr.innerHTML=`<div class="dh">Details${close}</div><div class="db">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px;text-align:center">${avatar(chatName(c),72)}<b>${esc(chatName(c))}</b><span class="small muted">${msgs.length.toLocaleString()} messages${msgs[0]&&msgs[0].ts?` · ${fmtDay(msgs[0].ts)} – ${fmtDay(msgs[msgs.length-1].ts)}`:''}</span></div>
      <div class="sec" style="margin-top:0">Members</div>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0">${avatar(p,36)}<div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(p===ME?p+' (You)':p)}</div><span class="small muted">${n.toLocaleString()}</span></div>`).join('')}
      <div class="sec">Stats</div><div class="small muted">${media.filter(x=>x.type==='img').length} photos · ${media.filter(x=>x.type==='video').length} videos · ${aud} voice messages · ${shares} shared posts</div>
      <div class="sec">Photos and videos</div><div id="dmedia"></div></div>`;
    const list=media.slice().reverse();
    if(list.length)infiniteGrid($('#dmedia'),list,(w,i)=>`<div class="tile" data-i="${i}">${w.type==='video'?`<video ${msrc(w.src,1)} preload="metadata" muted playsinline></video><div class="badge">▶</div>`:`<img ${msrc(w.src)} alt="">`}</div>`,30,i=>openLB(list,i));
    else $('#dmedia').innerHTML='<div class="small muted">None</div>';
  }else if(kind==='search'){
    dr.innerHTML=`<div class="dh">Search${close}</div><div style="padding:12px 16px 0"><div class="searchbox"><input id="cq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search in conversation"></div></div><div class="db" id="cres"></div>`;
    const inp=$('#cq');inp.focus({preventScroll:true});let t;
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};
    inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{const q=inp.value.trim().toLowerCase();const r=$('#cres');if(q.length<2){r.innerHTML='';return;}
      const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      const hits=[];msgs.forEach((m,i)=>{if(m.text&&m.text.toLowerCase().includes(q))hits.push(i);});
      r.innerHTML=`<div class="small muted" style="margin-bottom:8px">${hits.length.toLocaleString()} results</div>`+hits.slice(-500).reverse().map(i=>`<div class="res" data-j="${i}"><div class="small muted">${esc(msgs[i].from===ME?'You':msgs[i].from)} · ${fmtStamp(msgs[i].ts)}</div><div>${esc(msgs[i].text.slice(0,200)).replace(re,s=>`<mark>${s}</mark>`)}</div></div>`).join('');
      r.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{CH.stick=false;scrollToMsg(+x.dataset.j);if(isPhone())dr.classList.remove('open');});},250);};
  }else{
    const months=[];let last='';msgs.forEach((m,i)=>{if(!m.ts)return;const k=String(m.ts).slice(0,7);if(k!==last){months.push([k,i,0]);last=k;}months[months.length-1][2]++;});
    dr.innerHTML=`<div class="dh">Jump to date${close}</div><div class="db"><input type="date" id="jd" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:12px;min-height:44px" min="${String(msgs[0]&&msgs[0].ts||'').slice(0,10)}" max="${String(msgs[msgs.length-1]&&msgs[msgs.length-1].ts||'').slice(0,10)}">
      ${months.reverse().map(([k,i,n])=>`<div class="res" data-j="${i}" style="display:flex;justify-content:space-between"><span>${MONTHS[+k.slice(5)-1]||''} ${k.slice(0,4)}</span><span class="muted small">${n.toLocaleString()} messages</span></div>`).join('')}</div>`;
    $('#jd').onchange=e=>{const v=e.target.value;const i=msgs.findIndex(m=>m.ts&&String(m.ts).slice(0,10)>=v);if(i>=0){CH.stick=false;scrollToMsg(i);if(isPhone())dr.classList.remove('open');}};
    dr.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{CH.stick=false;scrollToMsg(+x.dataset.j);if(isPhone())dr.classList.remove('open');});
  }
  $('#dclose').onclick=()=>dr.classList.remove('open');
}

// ---------------- profile
let profTab='posts';
function viewProfile(tab){
  if(tab)profTab=tab;
  const me=personal();
  const posts=postItems(P.posts).filter(p=>p.media.length);
  const liked=postItems(P.liked);
  const collections=(page(P.saved).blocks||[]).map(b=>{const f=flat(b.value);return {name:pick(f,'Name'),ts:b.ts,urls:pickAll(f,'URL'),caps:pickAll(f,'Caption')};});
  const totalMsgs=IDX.chats.reduce((a,c)=>a+(c.count||0),0);
  main.innerHTML=`<div class="center">
    <div class="prof"><span class="ring pring">${avatar(ME,150).replace('class="avatar"','class="avatar big"')}</span>
      <div class="info"><div class="uname"><h2>${esc(ME)}</h2><div class="pbtns"><a class="btn gray" href="#/data">View all data</a><a class="btn gray" href="#/activity">Your activity</a></div></div>
      <div class="stats"><span><b>${posts.length}</b> posts</span><a href="#/inbox"><b>${IDX.chats.length}</b> chats</a><span><b>${totalMsgs.toLocaleString()}</b> messages</span></div>
      <div class="bio"><b>${esc(me.name||'')}</b><div style="white-space:pre-wrap">${esc(me.bio||'')}</div></div></div></div>
    <div class="ptabs">${[['posts','Posts',I.grid],['saved','Saved',I.save],['liked','Liked',I.heart]].map(([k,l,ic])=>`<button class="${profTab===k?'on':''}" data-t="${k}">${ic}${l}</button>`).join('')}</div>
    <div id="pbody"></div></div>`;
  main.querySelectorAll('.ptabs button').forEach(b=>b.onclick=()=>{location.hash='#/profile/'+b.dataset.t;});
  const pb=$('#pbody');
  if(profTab==='posts'){
    if(!posts.length){pb.innerHTML='<div class="empty"><h3>No posts yet</h3></div>';return;}
    const list=posts.map(p=>({...p.media[0],ts:p.ts,from:ME}));
    infiniteGrid(pb,list,(w,i)=>`<div class="tile tall" data-i="${i}">${w.type==='video'?`<video ${msrc(w.src,1)} muted playsinline preload="metadata"></video>`:`<img ${msrc(w.src)} alt="">`}${posts[i].media.length>1?`<div class="badge">${I.carousel}</div>`:''}</div>`,45,i=>openLB(list,i));
  }else if(profTab==='saved'){
    pb.innerHTML=`<div class="muted small" style="margin:16px 0">Only you can see what you've saved</div><div class="coll">${collections.map((c,i)=>`<a class="c" href="#/saved/${i}" style="background:linear-gradient(135deg,hsl(${hue(c.name)} 60% 45%),hsl(${(hue(c.name)+60)%360} 60% 35%))"><div>${esc(c.name||'All posts')}<div class="small" style="font-weight:400;opacity:.85">${c.urls.length} posts</div></div></a>`).join('')||'<div class="muted">No saved collections.</div>'}</div>`;
  }else{
    pb.innerHTML=`<div class="muted small" style="margin:16px 0">${liked.length} posts you liked</div>`;
    if(liked.length)infiniteGrid(pb,liked,p=>postTile(p,`<span style="color:#ff3040">${sized(I.heartF,18)}</span>`),60);
  }
}
function viewSaved(i){
  const collections=page(P.saved).blocks||[];
  if(i==null||!collections[i]){profTab='saved';location.hash='#/profile/saved';return;}
  const b=collections[i];const f=flat(b.value);
  const name=pick(f,'Name');
  const items=[];let cur=null;
  f.forEach(([k,v])=>{if(k==='URL'){cur={url:v,caption:'',owner:''};items.push(cur);}else if(cur&&k==='Caption'&&!cur.caption)cur.caption=v;else if(cur&&k==='Username'&&!cur.owner)cur.owner=v;});
  main.innerHTML=`<div class="center"><a href="#/profile/saved" class="muted" style="display:flex;gap:6px;align-items:center;margin-bottom:12px">${sized(I.back,18)} Saved</a><h2 style="font-size:20px;font-weight:400;margin-bottom:16px;word-break:break-word">${esc(name)}</h2><div id="sbody"></div></div>`;
  if(items.length)infiniteGrid($('#sbody'),items,p=>postTile(p,sized(I.saveF,18)),60);
  else $('#sbody').innerHTML='<div class="muted">This collection is empty.</div>';
}

// ---------------- generic data pages
const SECTIONS={
  your_instagram_activity:'Your activity',personal_information:'Personal information',connections:'Connections',
  security_and_login_information:'Security & login',logged_information:'Logged information',preferences:'Preferences',
  ads_information:'Ads information',apps_and_websites_off_of_instagram:'Apps & websites',
};
function viewData(filter){
  const groups={};
  Object.entries(PAGES).forEach(([path,pg])=>{const top=path.split('/')[0];if(filter&&top!==filter)return;(groups[top]=groups[top]||[]).push([path,pg]);});
  main.innerHTML=`<div class="center" style="max-width:720px"><h2 style="font-size:24px;margin-bottom:6px">${filter?esc(SECTIONS[filter]||filter):'Accounts Center · Your information'}</h2>
    <div class="muted">Everything in your export. Chats are in <a class="lnk" href="#/inbox">Messages</a>.</div>
    ${Object.entries(groups).map(([g,list])=>`<div class="sec">${esc(SECTIONS[g]||g)}</div><div class="plist">${list.sort((a,b)=>String(a[1].title||'').localeCompare(String(b[1].title||''))).map(([p,pg])=>`<a href="#/page/${encodeURIComponent(p)}"><div><div>${esc(pg.title||p)}</div>${pg.desc?`<div class="small muted">${esc(pg.desc)}</div>`:''}</div><span class="muted small">${(pg.blocks||[]).length} ›</span></a>`).join('')}</div>`).join('')}</div>`;
}
function renderVal(v){
  if(v==null||v==='')return '';
  if(typeof v==='string')return /^https?:\/\//.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>`:esc(v);
  if(v.link){
    const t=esc(v.text||v.link);
    if(v.link.startsWith('your_instagram_activity/messages/'))return `<span>${t}</span>`;
    if(/^https?:/.test(v.link))return `<a href="${esc(v.link)}" target="_blank" rel="noopener noreferrer">${t}</a>`;
    if(PAGES[v.link])return `<a class="lnk" href="#/page/${encodeURIComponent(v.link)}">${t}</a>`;
    if(LOCAL)return `<a href="${esc(mediaSrc(v.link))}" target="_blank" rel="noopener noreferrer">${t}</a>`;
    // relative file links point into the Drive export, not this site
    return `<a class="lnk" href="#" data-glink="${esc(v.link)}">${t}</a>`;
  }
  if(v.media)return `<div class="gmedia">${v.media.map(m=>m.type==='video'?`<video ${msrc(m.src)} controls playsinline></video>`:m.type==='audio'?`<audio ${msrc(m.src)} controls></audio>`:`<img ${msrc(m.src)} data-lb="${esc(m.src)}" alt="">`).join('')}</div>`;
  if(v.rows)return v.rows.map(([k,val])=>typeof val==='object'&&val&&(val.blocks||val.rows)?`<div class="gblock">${k?`<div class="gt">${esc(k)}</div>`:''}${renderVal(val)}</div>`:`<div class="kv"><div class="k">${esc(k)}</div><div class="v">${renderVal(val)}</div></div>`).join('');
  if(v.blocks){
    if(v.blocks.every(b=>typeof b.value==='string'&&!b.title))return `<div class="v">${v.blocks.map(b=>esc(b.value)).join(', ')}</div>`;
    return v.blocks.map(renderBlock).join('');
  }
  return '';
}
function renderBlock(b){
  const inner=renderVal(b.value);
  if(!b.title&&!b.date&&b.value&&b.value.blocks&&b.value.blocks.length===1)return inner;
  return `<div class="gblock">${b.title?`<div class="gt">${b.href&&b.href.includes('/messages/')?`<a class="lnk" href="#/inbox/${encodeURIComponent(b.href.split('/').slice(-2,-1)[0])}">${esc(b.title)}</a>`:esc(b.title)}</div>`:''}${inner}${b.date?`<div class="gdate">${esc(b.date)}</div>`:''}</div>`;
}
function viewPage(path){
  const pg=PAGES[path];
  if(!pg){main.innerHTML='<div class="empty" style="height:100%"><h3>Page not found</h3><a class="lnk" href="#/data">All data</a></div>';return;}
  const blocks=pg.blocks||[];
  const top=path.split('/')[0];
  main.innerHTML=`<div class="center" style="max-width:720px"><a href="#/data" class="muted" style="display:flex;gap:6px;align-items:center;margin-bottom:12px">${sized(I.back,18)} ${esc(SECTIONS[top]||'Your information')}</a>
    <h2 style="font-size:22px;word-break:break-word">${esc(pg.title||path)}</h2>${pg.desc?`<div class="muted" style="margin:4px 0 0">${esc(pg.desc)}</div>`:''}
    <div class="small muted" style="margin:6px 0 18px">${blocks.length} entr${blocks.length===1?'y':'ies'}</div><div id="gbody"></div></div>`;
  const body=$('#gbody');let n=0;
  function more(){const end=Math.min(blocks.length,n+60);let h='';for(;n<end;n++)h+=renderBlock(blocks[n]);body.insertAdjacentHTML('beforeend',h);}
  more();if(!blocks.length)body.innerHTML='<div class="muted">No data.</div>';
  main.onscroll=()=>{if(main.scrollTop+main.clientHeight>main.scrollHeight-800&&n<blocks.length)more();};
  body.addEventListener('click',e=>{
    const gl=e.target.closest('[data-glink]');
    if(gl){e.preventDefault();const w=window.open('','_blank');
      mediaURL(gl.dataset.glink).then(u=>{if(w)w.location.href=u;else location.href=u;}).catch(()=>{if(w)w.close();alert('That file is not in your Drive folder.');});return;}
    const im=e.target.closest('[data-lb]');if(im){const list=[...body.querySelectorAll('[data-lb]')].map(x=>({type:'img',src:x.dataset.lb}));openLB(list,list.findIndex(x=>x.src===im.dataset.lb));}
  });
}
function viewActivity(){
  const links=[
    ['Interactions',[[P.liked,'Likes'],[P.storiesViewed,'Stories viewed'],[P.storyLikes,'Story likes'],[P.polls,'Polls'],[P.stickers,'Story sticker reactions'],['your_instagram_activity/story_interactions/countdowns.html','Countdowns']]],
    ['Watched & viewed',[[P.videosWatched,'Videos watched'],[P.postsViewed,'Posts viewed'],['ads_information/ads_and_topics/posts_you_re_not_interested_in.html','Not interested']]],
    ['Content you shared',[[P.posts,'Posts & other content'],[P.saved,'Saved collections']]],
    ['Account history',[['security_and_login_information/login_and_profile_creation/login_activity.html','Login activity'],['security_and_login_information/login_and_profile_creation/logout_activity.html','Logout activity'],['security_and_login_information/login_and_profile_creation/profile_activity.html','Profile activity'],['security_and_login_information/login_and_profile_creation/profile_status_changes.html','Status changes'],['security_and_login_information/login_and_profile_creation/profile_privacy_changes.html','Privacy changes'],[P.searches,'Recent searches']]],
  ];
  main.innerHTML=`<div class="center" style="max-width:720px"><h2 style="font-size:24px;margin-bottom:6px">Your activity</h2><div class="muted">One place to review what you've done on Instagram.</div>
    ${links.map(([g,arr])=>{const rows=arr.filter(([p])=>PAGES[p]);return rows.length?`<div class="sec">${g}</div><div class="plist">${rows.map(([p,l])=>`<a href="#/page/${encodeURIComponent(p)}"><span>${l}</span><span class="muted small">${(PAGES[p].blocks||[]).length} ›</span></a>`).join('')}</div>`:'';}).join('')}
    <div class="sec">Everything else</div><div class="plist"><a href="#/data"><span>All information in your export</span><span class="muted">›</span></a></div></div>`;
}

// ---------------- router
function route(){
  const h=location.hash.replace(/^#\/?/,'');const parts=h.split('/');
  const v=parts[0]||'home';
  main.onscroll=null;
  if(v!=='inbox'){main.dataset.view=v;}
  let active=v;
  app.classList.toggle('no-mtop',v==='inbox'||v==='reels');
  document.body.classList.toggle('inchat',v==='inbox'&&!!parts[1]);
  if(v==='home'||v==='')viewHome();
  else if(v==='explore')viewExplore();
  else if(v==='reels')viewReels();
  else if(v==='inbox'){const id=parts[1]?decodeURIComponent(parts[1]):null;const focus=parts.slice(2).join('/')||null;viewInbox(id,focus);main.dataset.view='inbox';}
  else if(v==='profile')viewProfile(parts[1]);
  else if(v==='saved'){parts[1]!=null&&parts[1]!==''?viewSaved(+parts[1]):(profTab='saved',viewProfile('saved'));active='profile';}
  else if(v==='data')viewData(parts[1]);
  else if(v==='page')viewPage(decodeURIComponent(parts.slice(1).join('/')));
  else if(v==='activity')viewActivity();
  else{viewHome();active='home';}
  curView=active;
  renderNav(panelKind||active);
  if(v!=='inbox')main.scrollTop=0;
}
// ---------------- boot
function signInScreen(msg){
  $('#nav').style.display='none';$('#mtop').style.display='none';
  main.innerHTML=`<div class="signin"><div class="word">Instagram</div>
    <div class="muted">Your archive, read privately from your Google Drive.</div>
    ${msg?`<div style="color:#ed4956">${msg}</div>`:''}
    <button class="btn" id="gsign" style="padding:12px">Sign in with Google</button>
    <details style="text-align:left"><summary class="muted small" style="cursor:pointer">Use a different Drive folder</summary>
      <input id="gfold" style="width:100%;margin-top:8px" placeholder="Paste Drive folder link" value="${esc(ls.get('ig-folder')?'https://drive.google.com/drive/folders/'+ls.get('ig-folder'):'')}"></details>
    <div class="muted small">Only you can read the files: access uses your own Google sign-in and is read-only.</div></div>`;
  $('#gsign').onclick=async()=>{
    const f=$('#gfold').value.trim();if(f){const id=parseFolder(f);if(!id){signInScreen('That is not a Drive folder link.');return;}ls.set('ig-folder',id);}
    try{await requestToken(true);start();}catch(e){signInScreen('Sign-in was cancelled or blocked. Allow pop-ups and try again.');}
  };
}
let started=false;
async function start(){
  $('#nav').style.display='';$('#mtop').style.display='';
  main.innerHTML='<div class="loading"><div class="spin"></div><span id="bootmsg">Opening your Drive folder…</span></div>';
  try{
    if(!LOCAL)await findRoots();
    $('#bootmsg').textContent='Loading your chats…';
    const [idx,pages]=await Promise.all([loadData('index','viewer_data/index.js'),loadData('pages','viewer_data/pages.js')]);
    IDX=idx||{};PAGES=pages||{};ME=IDX.owner||'';
    IDX.chats=IDX.chats||[];IDX.wall=IDX.wall||[];
    IDX.generated=IDX.chats.reduce((a,c)=>c.last&&c.last.ts&&c.last.ts>a?c.last.ts:a,'')||IDX.generated;
    IDX.chats.forEach(c=>chatById[c.id]=c);
  }catch(e){
    if(e.message==='NO_VIEWER_DATA')signInScreen('The <b>viewer_data</b> folder was not found in this Drive folder. Upload it next to <b>your_instagram_activity</b>.');
    else if(/Drive 40[34]|Not found/.test(e.message))signInScreen('Could not open the Drive folder. Make sure you signed in with the Google account that owns it.');
    else signInScreen('Something went wrong: '+esc(e.message));
    return;
  }
  if(!started){started=true;window.addEventListener('hashchange',()=>{if(panelKind){panel.classList.remove('open');panelKind=null;}morepop.classList.remove('open');closeLB(true);route();});}
  route();
}
if(LOCAL||(token&&tokenExp>Date.now()+60e3))start();
else if(CONFIG.CLIENT_ID.startsWith('PASTE_'))signInScreen('Setup needed: paste your OAuth Client ID into CONFIG at the top of the script.');
else signInScreen('');

})();
</script>
