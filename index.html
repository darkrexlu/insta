<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Archive</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#fff;--bg2:#fafafa;--bg3:#efefef;--line:#dbdbdb;--fg:#000;--fg2:#737373;--link:#00376b;
  --blue:#0095f6;--me:#3797f0;--them:#efefef;--themfg:#000;--hover:#f2f2f2;--overlay:rgba(0,0,0,.65);
  --ring:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--bg2:#121212;--bg3:#262626;--line:#262626;--fg:#f5f5f5;--fg2:#a8a8a8;--link:#e0f1ff;
  --them:#262626;--themfg:#f5f5f5;--hover:#1a1a1a;
}}
:root[data-theme="dark"]{
  --bg:#000;--bg2:#121212;--bg3:#262626;--line:#262626;--fg:#f5f5f5;--fg2:#a8a8a8;--link:#e0f1ff;
  --them:#262626;--themfg:#f5f5f5;--hover:#1a1a1a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:var(--fg)}
svg{display:block}
.app{display:flex;height:100vh}

/* ---------- sidebar ---------- */
.nav{width:245px;flex:none;border-right:1px solid var(--line);padding:8px 12px 20px;display:flex;flex-direction:column;
  position:relative;z-index:5;background:var(--bg)}
.nav .logo{padding:25px 12px 16px;height:92px}
.nav .logo .word{font-family:"Grand Hotel","Billabong","Segoe Script","Brush Script MT",cursive;font-size:30px;line-height:1}
.nav .logo .glyph{display:none}
.nav a.item,.nav button.item{display:flex;align-items:center;gap:16px;padding:12px;margin:2px 0;border-radius:8px;font-size:16px;width:100%;text-align:left}
.nav .item:hover{background:var(--hover)}
.nav .item.on{font-weight:700}
.nav .item svg{width:24px;height:24px;flex:none;transition:transform .15s}
.nav .item:hover svg{transform:scale(1.05)}
.nav .spacer{flex:1}
.nav.compact{width:73px}
.nav.compact .label,.nav.compact .logo .word{display:none}
.nav.compact .logo .glyph{display:block}
.avatar{border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;
  background:linear-gradient(135deg,#888,#444);text-transform:uppercase;user-select:none}
.ring{padding:2px;border-radius:50%;background:var(--ring);display:inline-block}
.ring>.avatar{border:2px solid var(--bg)}
.ring.seen{background:var(--line)}
.morepop{position:absolute;bottom:70px;left:12px;width:266px;background:var(--bg);border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);padding:8px;display:none;z-index:50}
.morepop.open{display:block}
.morepop button,.morepop a{display:flex;gap:12px;align-items:center;padding:14px 16px;width:100%;border-radius:8px;text-align:left}
.morepop button:hover,.morepop a:hover{background:var(--hover)}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;min-width:0;position:relative}
.center{max-width:935px;margin:0 auto;padding:30px 20px 60px}
h1,h2,h3{margin:0}
.muted{color:var(--fg2)}
.small{font-size:12px}
.btn{background:var(--blue);color:#fff;padding:7px 16px;border-radius:8px;font-weight:600}
.btn.gray{background:var(--bg3);color:var(--fg)}
.btn:hover{filter:brightness(.95)}
.chip{padding:6px 14px;border-radius:8px;background:var(--bg3);font-weight:600;font-size:14px}
.chip.on{background:var(--fg);color:var(--bg)}

/* home */
.home{display:flex;justify-content:center;gap:64px;padding:22px 20px 60px}
.feed{width:470px;max-width:100%}
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 0 16px;margin-bottom:12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{width:66px;flex:none;text-align:center;font-size:12px}
.story .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.post{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.post .hd{display:flex;align-items:center;gap:10px;padding:0 4px 12px}
.post .hd b{font-weight:600}
.post .card{border:1px solid var(--line);border-radius:4px;aspect-ratio:1/1;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;padding:32px;gap:16px;overflow:hidden;position:relative}
.post .card .cap{font-size:18px;line-height:1.35;max-height:70%;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.post .card img,.post .card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post .acts{display:flex;gap:16px;padding:10px 0 6px}
.post .acts svg{width:24px;height:24px}
.post .cap2{white-space:pre-wrap;word-break:break-word;line-height:1.4;max-height:5.6em;overflow:hidden}
.post .cap2.open{max-height:none}
.side{width:320px;padding-top:30px}
.side .me{display:flex;gap:12px;align-items:center;margin-bottom:24px}
.side h4{margin:0 0 10px;color:var(--fg2);font-size:14px}
.side .sug{display:flex;gap:12px;align-items:center;padding:8px 0}
.side .sug .tx{flex:1;min-width:0}
.side .sug .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{color:var(--fg2);font-size:12px;margin-top:30px;line-height:1.6}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{aspect-ratio:1/1;position:relative;background:var(--bg3);overflow:hidden;cursor:pointer}
.tile.tall{aspect-ratio:3/4}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .badge{position:absolute;top:8px;right:8px;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.tile .hov{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;gap:6px;transition:opacity .1s;padding:10px;text-align:center}
.tile:hover .hov{opacity:1}
.sentinel{height:40px}
.gload{opacity:.4}
.gfail{opacity:.25}
.tile video:not([src]){background:#222}
.signin{max-width:380px;margin:12vh auto;padding:40px 32px;border:1px solid var(--line);border-radius:4px;text-align:center;display:flex;flex-direction:column;gap:16px}
.signin .word{font-family:"Grand Hotel","Billabong","Segoe Script","Brush Script MT",cursive;font-size:44px}
.signin input{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}

/* reels */
.reels{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 0}
.reel .vid{height:calc(100vh - 32px);aspect-ratio:9/16;max-width:calc(100vw - 140px);background:#000;border-radius:8px;overflow:hidden;position:relative}
.reel video{width:100%;height:100%;object-fit:contain;background:#000}
.reel .meta{position:absolute;left:0;right:0;bottom:0;padding:16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.reel .meta a{pointer-events:auto}
.reel .side-acts{display:flex;flex-direction:column;gap:20px;align-self:flex-end;padding-bottom:20px;align-items:center;font-size:12px}
.reel .side-acts svg{width:26px;height:26px}

/* ---------- DMs ---------- */
.dm{display:flex;height:100vh}
.threads{width:397px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.threads .top{padding:36px 24px 12px}
.threads .top h2{font-size:20px;display:flex;align-items:center;gap:8px}
.threads .tabs{display:flex;gap:22px;padding:8px 24px 6px;flex-wrap:wrap}
.threads .tabs button{font-weight:700;font-size:16px;padding:6px 0;color:var(--fg2)}
.threads .tabs button.on{color:var(--fg)}
.searchbox{background:var(--bg3);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;height:40px}
.searchbox input{flex:1;border:0;background:none;outline:none;min-width:0}
.threads .list{overflow-y:auto;overflow-x:hidden;flex:1}
.th{display:flex;gap:12px;align-items:center;padding:8px 24px;cursor:pointer}
.th:hover{background:var(--hover)}
.th.on{background:var(--bg3)}
.th .tx{flex:1;min-width:0}
.th .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .pv{color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.chat .hd{height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:none}
.chat .hd .tt{flex:1;min-width:0}
.chat .hd .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .hd .ic{padding:8px}
.chat .hd svg{width:24px;height:24px}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;overflow-anchor:none}
.intro{text-align:center;padding:30px 0 40px}
.intro .avatar{margin:0 auto 12px}
.ts{text-align:center;color:var(--fg2);font-size:12px;margin:18px 0 10px;font-weight:600}
.row{display:flex;align-items:flex-end;gap:8px;margin:1px 0}
.row.me{justify-content:flex-end}
.row .av{width:28px;flex:none}
.bwrap{max-width:min(564px,70%);display:flex;flex-direction:column;align-items:flex-start;position:relative}
.row.me .bwrap{align-items:flex-end}
.sender{font-size:12px;color:var(--fg2);margin:8px 12px 2px}
.bubble{padding:8px 12px;border-radius:18px;background:var(--them);color:var(--themfg);white-space:pre-wrap;word-break:break-word;line-height:1.35;font-size:15px}
.row.me .bubble{background:var(--me);color:#fff}
.bubble.emoji{background:none!important;font-size:40px;padding:0 2px;line-height:1.15}
.row:not(.first) .bubble{border-top-left-radius:4px}
.row:not(.last) .bubble{border-bottom-left-radius:4px}
.row.me:not(.first) .bubble{border-top-left-radius:18px;border-top-right-radius:4px}
.row.me:not(.last) .bubble{border-bottom-left-radius:18px;border-bottom-right-radius:4px}
.row.first .bubble{border-top-left-radius:18px}
.row.last .bubble{border-bottom-left-radius:18px}
.row.me.first .bubble{border-top-right-radius:18px}
.row.me.last .bubble{border-bottom-right-radius:18px}
.bubble a{text-decoration:underline}
.mimg{max-width:240px;max-height:320px;border-radius:18px;display:block;cursor:pointer;background:var(--bg3);min-width:60px;min-height:60px;object-fit:cover}
.mvid{max-width:260px;max-height:360px;border-radius:18px;display:block;background:#000}
audio{height:40px;max-width:260px}
.share{width:230px;border-radius:18px;overflow:hidden;background:var(--them);color:var(--themfg);display:block}
.share .sh{display:flex;gap:8px;align-items:center;padding:10px 12px;font-weight:600;font-size:13px}
.share .sb{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;
  background:linear-gradient(160deg,#405de6,#833ab4 40%,#e1306c 75%,#fd1d1d);color:#fff;font-size:14px;line-height:1.35;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.share .sb.gif{padding:0;background:var(--bg3)}
.share .sb.gif img{width:100%;height:100%;object-fit:cover}
.share .sf{padding:8px 12px;font-size:12px;color:var(--fg2)}
.reacts{display:flex;gap:1px;background:var(--bg3);border:2px solid var(--bg);border-radius:12px;padding:1px 5px;font-size:13px;margin-top:-6px;
  position:relative;z-index:1;cursor:default;margin-left:8px}
.row.me .reacts{margin-right:8px}
.reacts span.n{color:var(--fg2);font-size:12px;margin-left:3px}
.sys{text-align:center;color:var(--fg2);font-size:12px;margin:10px 0;display:flex;justify-content:center}
.sys span{display:flex;gap:6px;align-items:center;background:var(--bg3);padding:6px 12px;border-radius:14px}
.unav{font-style:italic;opacity:.8}
.mtime{display:none;font-size:11px;color:var(--fg2);align-self:center;white-space:nowrap}
.row:hover .mtime{display:block}
.flash .bubble,.flash .mimg,.flash .share{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px #ffcc00}100%{box-shadow:none}}
mark{background:#ffe066;color:#000;border-radius:3px}
.composer{margin:8px 16px 16px;border:1px solid var(--line);border-radius:22px;height:44px;display:flex;align-items:center;padding:0 14px;gap:10px;color:var(--fg2);flex:none}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.empty .big{width:96px;height:96px;border:2px solid var(--fg);border-radius:50%;display:grid;place-items:center}
.drawer{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--bg);border-left:1px solid var(--line);z-index:20;
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.drawer.open{transform:none}
.drawer .dh{height:75px;display:flex;align-items:center;padding:0 16px;font-size:18px;font-weight:700;border-bottom:1px solid var(--line);gap:10px;flex:none}
.drawer .db{overflow-y:auto;flex:1;padding:16px}
.drawer .grid{gap:2px}
.res{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.res:hover{background:var(--hover)}
.loading{display:flex;align-items:center;justify-content:center;flex:1;color:var(--fg2);gap:10px}
.spin{width:22px;height:22px;border:3px solid var(--bg3);border-top-color:var(--fg2);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* profile */
.prof{display:flex;gap:80px;padding:10px 40px 40px;align-items:center}
.prof .info{display:flex;flex-direction:column;gap:18px;min-width:0}
.prof .uname{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prof .uname h2{font-size:20px;font-weight:400}
.prof .stats{display:flex;gap:40px;font-size:16px}
.prof .stats b{font-weight:600}
.ptabs{border-top:1px solid var(--line);display:flex;justify-content:center;gap:60px}
.ptabs button{display:flex;gap:6px;align-items:center;padding:16px 0;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--fg2);border-top:1px solid transparent;margin-top:-1px;text-transform:uppercase}
.ptabs button.on{color:var(--fg);border-top-color:var(--fg)}
.ptabs svg{width:12px;height:12px}
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.coll .c{aspect-ratio:1/1;border-radius:8px;background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;display:flex;align-items:flex-end;padding:14px;font-size:16px;font-weight:600;cursor:pointer}

/* generic pages */
.plist a{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:8px}
.plist a:hover{background:var(--hover)}
.sec{margin:26px 0 8px;font-weight:700;font-size:16px}
.gblock{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--bg)}
.gblock .gblock{border:0;padding:6px 0 0 12px;margin:6px 0 0;border-left:2px solid var(--line);border-radius:0}
.gt{font-weight:600;margin-bottom:6px}
.kv{display:grid;grid-template-columns:minmax(110px,200px) 1fr;gap:4px 16px;padding:3px 0}
.kv .k{color:var(--fg2)}
.kv .v{word-break:break-word;white-space:pre-wrap}
.kv .v a,.lnk{color:var(--blue)}
.gdate{color:var(--fg2);font-size:12px;margin-top:6px}
.gmedia img,.gmedia video{max-width:240px;max-height:240px;border-radius:8px;margin:4px 4px 0 0;cursor:pointer}

/* panels (search / notifications) */
.panel{position:absolute;left:73px;top:0;bottom:0;width:397px;background:var(--bg);border-right:1px solid var(--line);border-radius:0 16px 16px 0;
  box-shadow:4px 0 24px rgba(0,0,0,.15);z-index:4;display:flex;flex-direction:column;transform:translateX(-110%);transition:transform .25s}
.panel.open{transform:none}
.panel .ph{padding:24px 24px 12px}
.panel .ph h2{font-size:24px;margin-bottom:28px}
.panel .pb{overflow-y:auto;flex:1;border-top:1px solid var(--line);padding:12px 0}
.panel .it{display:flex;gap:12px;padding:8px 24px;align-items:center;cursor:pointer}
.panel .it:hover{background:var(--hover)}
.panel .it .tx{flex:1;min-width:0;line-height:1.35}
.panel h4{padding:8px 24px;margin:0}

/* lightbox */
.lb{position:fixed;inset:0;background:var(--overlay);z-index:100;display:none;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb .box{max-width:92vw;max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:10px}
.lb img,.lb video{max-width:92vw;max-height:84vh;border-radius:4px;background:#000}
.lb .cap{color:#fff;font-size:13px;display:flex;gap:14px;align-items:center}
.lb .cap a{text-decoration:underline}
.lb .x{position:fixed;top:14px;right:20px;color:#fff;font-size:32px}
.lb .ar{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);color:#000;width:32px;height:32px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.lb .ar.l{left:20px}.lb .ar.r{right:20px}

/* mobile */
.mtop{display:none}
@media (max-width:1264px){.nav{width:73px}.nav .label,.nav .logo .word{display:none}.nav .logo .glyph{display:block}.side{display:none}}
@media (max-width:767px){
  .app{flex-direction:column-reverse}
  .nav{width:100%!important;flex-direction:row;height:50px;padding:0;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
  .nav .logo,.nav .spacer,.nav .hide-m{display:none}
  .nav a.item,.nav button.item{width:auto;padding:12px}
  .panel{left:0;width:100%;bottom:50px;border-radius:0}
  .morepop{bottom:56px;left:auto;right:8px}
  .dm,.reel .vid{height:calc(100vh - 50px)}
  .threads{width:100%}
  .dm.inchat .threads{display:none}
  .dm:not(.inchat) .chat{display:none}
  .prof{gap:24px;padding:10px 0 24px}
  .prof .big{width:86px!important;height:86px!important;font-size:30px!important}
  .prof .stats{gap:18px;font-size:14px}
  .ptabs{gap:30px}
  .center{padding:16px 16px 60px}
  .home{padding:0 0 60px}
  .feed{padding:0 0}
  .reel{height:calc(100vh - 50px);padding:0}
  .reel .vid{max-width:100vw;border-radius:0}
  .reel .side-acts{position:absolute;right:10px;color:#fff}
  .drawer{width:100%}
  .kv{grid-template-columns:1fr}
  .coll{grid-template-columns:repeat(2,1fr)}
  .bwrap{max-width:78%}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <main id="main"><div class="loading"><div class="spin"></div>Loading your archive…</div></main>
</div>
<div class="panel" id="panel"></div>
<div class="lb" id="lb"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
"use strict";
let IDX, PAGES, ME;
// ================= storage layer: Google Drive (or local files with ?local) =================
const CONFIG={
  CLIENT_ID:'PASTE_YOUR_CLIENT_ID.apps.googleusercontent.com',
  FOLDER_ID:'1I3yOfb9D81FHo67NQ3nIBM-oQgAf2VzT',
};
const LOCAL=/[?&]local\b/.test(location.search);
const SCOPE='https://www.googleapis.com/auth/drive.readonly';
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let token=null,tokenExp=0,tokenClient=null,tokenWaiters=[];
(function(){const t=ss.get('ig-tok'),e=+ss.get('ig-tokexp')||0;if(t&&e>Date.now()+60e3){token=t;tokenExp=e;}})();
function folderId(){return ls.get('ig-folder')||CONFIG.FOLDER_ID;}
function parseFolder(s){const m=String(s).match(/folders\/([\w-]{10,})/)||String(s).match(/[?&]id=([\w-]{10,})/)||String(s).match(/^([\w-]{10,})$/);return m?m[1]:null;}
function gisReady(){return new Promise(r=>{const ok=()=>window.google&&google.accounts&&google.accounts.oauth2;if(ok())return r();const iv=setInterval(()=>{if(ok()){clearInterval(iv);r();}},100);});}
async function requestToken(interactive){
  await gisReady();
  if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:CONFIG.CLIENT_ID,scope:SCOPE,
    callback:resp=>{const w=tokenWaiters;tokenWaiters=[];

  panelKind=kind;panel.classList.add('open');
  $('#nav').classList.add('compact');
  if(kind==='search')renderSearchPanel();else renderNotifPanel();
}
function renderSearchPanel(){
  const recent=page(P.searches).blocks.map(b=>({q:pick(flat(b.value),'Search query'),ts:b.ts}));
  panel.innerHTML=`<div class="ph"><h2>Search</h2><div class="searchbox">${I.search.replace('<svg','<svg width="16" height="16"')}<input id="gq" placeholder="Search messages and people" autofocus></div>
    <div class="small muted" style="margin-top:8px">Searches every message in your archive.</div></div>
    <div class="pb" id="gres">
      <h4>People</h4>${IDX.chats.slice(0,8).map(c=>personRow(c)).join('')}
      ${recent.length?`<h4 style="margin-top:12px">Recent searches</h4>`+recent.map(r=>`<div class="it" data-q="${esc(r.q)}"><div class="avatar" style="width:44px;height:44px;background:var(--bg3);color:var(--fg)">${I.search.replace('<svg','<svg width="18" height="18"')}</div><div class="tx">${esc(r.q)}<div class="small muted">${fmtDay(r.ts)}</div></div></div>`).join(''):''}
    </div>`;
  const inp=$('#gq');setTimeout(()=>inp.focus(),50);
  let t;inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>globalSearch(inp.value.trim()),300);};
  panel.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{inp.value=x.dataset.q;globalSearch(x.dataset.q);});
  bindPersonRows(panel);
}
function personRow(c){return `<div class="it" data-chat="${esc(c.id)}">${avatar(chatName(c),44)}<div class="tx"><b>${esc(chatName(c))}</b><div class="small muted">${c.count.toLocaleString()} messages</div></div></div>`;}
function bindPersonRows(r){r.querySelectorAll('[data-chat]').forEach(x=>x.onclick=()=>{closePanel();location.hash='#/inbox/'+encodeURIComponent(x.dataset.chat)+(x.dataset.i?'/'+x.dataset.i:'');});}
let searchToken=0;
async function globalSearch(q){
  const box=$('#gres');if(!box)return;const tok=++searchToken;
  if(q.length<2){renderSearchPanel();$('#gq').value=q;return;}
  const ql=q.toLowerCase();
  const people=IDX.chats.filter(c=>chatName(c).toLowerCase().includes(ql)||c.people.some(p=>p.toLowerCase().includes(ql)));
  box.innerHTML=(people.length?'<h4>People</h4>'+people.map(personRow).join(''):'')+'<h4 style="margin-top:8px">Messages</h4><div id="mres"><div class="loading" style="padding:20px"><div class="spin"></div><span id="sprog">Searching…</span></div></div>';
  bindPersonRows(box);
  const hits=[];
  const order=[...IDX.chats].sort((a,b)=>a.count-b.count);
  for(let k=0;k<order.length;k++){
    const c=order[k];const p=$('#sprog');if(p)p.textContent=`Searching ${chatName(c)}… (${k+1}/${order.length})`;
    const ch=await getChat(c.id);if(tok!==searchToken)return;
    ch.messages.forEach((m,i)=>{const t=m.text||'';if(t&&!SYS_RE.test(t)&&t.toLowerCase().includes(ql))hits.push({c,m,i});});
  }
  hits.sort((a,b)=>(b.m.ts||'').localeCompare(a.m.ts||''));
  const mres=$('#mres');if(!mres)return;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  mres.innerHTML=hits.length?`<div class="small muted" style="padding:0 24px 8px">${hits.length.toLocaleString()} results</div>`+hits.slice(0,400).map(h=>`<div class="it" data-chat="${esc(h.c.id)}" data-i="${h.i}">${avatar(chatName(h.c),36)}<div class="tx"><div class="small"><b>${esc(chatName(h.c))}</b> · <span class="muted">${fmtDay(h.m.ts)}</span></div><div class="small">${h.m.from===ME?'You: ':''}${esc(h.m.text.slice(0,140)).replace(re,s=>`<mark>${s}</mark>`)}</div></div></div>`).join(''):'<div class="muted" style="padding:12px 24px">No messages found.</div>';
  bindPersonRows(mres);
}
function renderNotifPanel(){
  const items=[];
  postItems(P.storyLikes).forEach(x=>items.push({ts:x.ts,who:x.owner,txt:`You liked <b>${esc(x.owner)}</b>'s story.${x.caption?' “'+esc(x.caption.slice(0,60))+'”':''}`,url:x.url}));
  page(P.polls).blocks.forEach(b=>{const f=flat(b.value);items.push({ts:b.ts,who:pick(f,'Username')||'poll',txt:`You voted in a poll${pick(f,'Username')?' by <b>'+esc(pick(f,'Username'))+'</b>':''}: ${esc(f.filter(r=>typeof r[1]==='string'&&r[0]!=='Username'&&r[0]!=='URL').map(r=>r[1]).slice(0,2).join(' · '))}`});});
  page(P.stickers).blocks.forEach(b=>{const f=flat(b.value);items.push({ts:b.ts,who:pick(f,'Username')||'story',txt:`You reacted to a story${pick(f,'Username')?' by <b>'+esc(pick(f,'Username'))+'</b>':''}. ${esc(f.filter(r=>typeof r[1]==='string'&&!['Username','URL','Name'].includes(r[0])).map(r=>r[1]).slice(0,2).join(' · '))}`});});
  postItems(P.liked).forEach(x=>items.push({ts:x.ts,who:x.owner,txt:`You liked a post by <b>${esc(x.owner||'someone')}</b>.${x.caption?' “'+esc(x.caption.slice(0,60))+'…”':''}`,url:x.url}));
  // reactions others left on your messages are inside chats; show latest chat activity
  IDX.chats.slice(0,10).forEach(c=>c.last&&c.last.from!==ME&&items.push({ts:c.last.ts,who:chatName(c),txt:`<b>${esc(chatName(c))}</b> messaged you: ${esc((c.last.text||'').slice(0,60))}`,chat:c.id}));
  items.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const groups={};const ref=IDX.generated?new Date(IDX.generated):new Date();
  items.forEach(it=>{const days=(ref-new Date(it.ts))/864e5;const g=days<7?'This week':days<30?'This month':'Earlier';(groups[g]=groups[g]||[]).push(it);});
  panel.innerHTML=`<div class="ph"><h2 style="margin-bottom:8px">Notifications</h2><div class="small muted">Your story likes, poll votes, liked posts and recent messages.</div></div><div class="pb">`+
    Object.entries(groups).map(([g,arr])=>`<h4>${g}</h4>`+arr.map(it=>`<div class="it" ${it.chat?`data-chat="${esc(it.chat)}"`:it.url?`data-url="${esc(it.url)}"`:''}>${avatar(it.who,44)}<div class="tx">${it.txt} <span class="muted">${ago(it.ts)}</span></div></div>`).join('')).join('')+'</div>';
  bindPersonRows(panel);
  panel.querySelectorAll('[data-url]').forEach(x=>x.onclick=()=>window.open(x.dataset.url,'_blank','noopener'));
}

// ---------------- lightbox
let lbList=[],lbI=0;
function openLB(list,i){lbList=list;lbI=i;drawLB();lb.classList.add('open');}
function drawLB(){
  const it=lbList[lbI];if(!it)return;
  const c=it.chat&&chatById[it.chat];
  lb.innerHTML=`<button class="x" aria-label="Close">×</button>
    ${lbI>0?'<button class="ar l" aria-label="Previous">‹</button>':''}${lbI<lbList.length-1?'<button class="ar r" aria-label="Next">›</button>':''}
    <div class="box">${it.type==='video'?`<video ${msrc(it.src)} controls autoplay playsinline></video>`:`<img ${msrc(it.src)} alt="">`}
    <div class="cap">${it.from?`<span>${esc(it.from===ME?'You':it.from)}</span>`:''}${it.ts?`<span>${fmtStamp(it.ts)}</span>`:''}
    ${c?`<a href="#/inbox/${encodeURIComponent(c.id)}/src:${encodeURIComponent(it.src)}">Open in chat with ${esc(chatName(c))}</a>`:''}
    <span>${lbI+1} / ${lbList.length}</span></div></div>`;
  lb.querySelector('.x').onclick=closeLB;
  const l=lb.querySelector('.ar.l'),r=lb.querySelector('.ar.r');
  if(l)l.onclick=e=>{e.stopPropagation();lbI--;drawLB();};
  if(r)r.onclick=e=>{e.stopPropagation();lbI++;drawLB();};
  const a=lb.querySelector('.cap a');if(a)a.onclick=()=>closeLB();
}
function closeLB(){lb.classList.remove('open');lb.innerHTML='';}
lb.addEventListener('click',e=>{if(e.target===lb)closeLB();});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft'&&lbI>0){lbI--;drawLB();}
  if(e.key==='ArrowRight'&&lbI<lbList.length-1){lbI++;drawLB();}
});

// ---------------- infinite grid
function infiniteGrid(container,list,tileFn,batch=45,onClick){
  let n=0;const grid=document.createElement('div');grid.className='grid';container.appendChild(grid);
  const sent=document.createElement('div');sent.className='sentinel';container.appendChild(sent);
  function more(){const end=Math.min(list.length,n+batch);let h='';for(;n<end;n++)h+=tileFn(list[n],n);grid.insertAdjacentHTML('beforeend',h);if(n>=list.length)io.disconnect();}
  const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))more();},{root:null,rootMargin:'800px'});
  more();io.observe(sent);
  grid.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)onClick(+t.dataset.i);});
}
function mediaTile(w,i){
  return `<div class="tile" data-i="${i}">${w.type==='video'?`<video ${msrc(w.src,1)} preload="metadata" muted playsinline></video><div class="badge">${I.reels.replace('<svg','<svg width="20" height="20" style="stroke:#fff"')}</div>`:`<img ${msrc(w.src)} loading="lazy" alt="">`}
    <div class="hov">${esc(w.from===ME?'You':w.from||'')}<br>${fmtDay(w.ts)}</div></div>`;
}

      <a class="card" href="${esc(p.url||'#')}" target="_blank" rel="noopener noreferrer" style="background:linear-gradient(${hue(p.owner)}deg,hsl(${hue(p.owner)} 60% 92%),hsl(${(hue(p.owner)+60)%360} 60% 80%));color:#111">
        ${p.media.length?(p.media[0].type==='video'?`<video ${msrc(p.media[0].src)} controls></video>`:`<img ${msrc(p.media[0].src)} loading="lazy">`):`<div class="cap">${esc(p.caption||(p.watched?'Video you watched':'Post'))}</div><div class="small" style="display:flex;gap:6px;align-items:center">View on Instagram ${I.ext}</div>`}

  const s=stories[i];if(!s)return;

function viewReels(){
  const vids=IDX.wall.filter(w=>w.type==='video');
  main.innerHTML=`<div class="reels" id="rl"></div>`;
  const rl=$('#rl');
  if(!vids.length){rl.innerHTML='<div class="empty"><h3>No videos</h3></div>';return;}
  let n=0;
  const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;
    if(e.isIntersecting&&e.intersectionRatio>.6){e.target.classList.add('playing');v.play().catch(()=>{});}else{e.target.classList.remove('playing');v.pause();}}),{root:rl,threshold:[0,.6,1]});
  function more(){const end=Math.min(vids.length,n+6);for(;n<end;n++){const w=vids[n];const c=chatById[w.chat];
    const el=document.createElement('div');el.className='reel';
    el.innerHTML=`<div class="vid"><video ${msrc(w.src)} loop playsinline preload="${n<2?'auto':'metadata'}" controls></video>
      <div class="meta"><div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">${avatar(w.from||'?',32)}<b>${esc(w.from===ME?'You':w.from)}</b></div>
      <div class="small">Sent in chat with ${esc(c?chatName(c):'')} · ${fmtDay(w.ts)}</div></div></div>
      <div class="side-acts">${I.heart}<span>${n+1}/${vids.length}</span>${c?`<a href="#/inbox/${encodeURIComponent(c.id)}/src:${encodeURIComponent(w.src)}" title="Open in chat">${I.comment}</a>`:''}${I.dm}</div>`;
    rl.appendChild(el);io.observe(el);}}
  more();
  rl.onscroll=()=>{if(rl.scrollTop+rl.clientHeight>rl.scrollHeight-rl.clientHeight*2&&n<vids.length)more();};
}

function drawThreads(activeId){
  if(typeof activeId!=='string')activeId=$('#chat')&&$('#chat').dataset.id;
  const q=($('#tq').value||'').toLowerCase();
  const counts={primary:0,requests:0,ai:0};
  IDX.chats.forEach(c=>counts[c.kind==='inbox'?'primary':c.kind==='ai'?'ai':'requests']++);
  if(activeId&&chatById[activeId]){const k=chatById[activeId].kind;dmTab=k==='inbox'?'primary':k==='ai'?'ai':'requests';}
  $('#ttabs').innerHTML=[['primary','Messages'],['requests','Requests'],['ai','AI']].map(([k,l])=>`<button class="${dmTab===k?'on':''}" data-t="${k}">${l} <span class="small muted">${counts[k]}</span></button>`).join('');
  $('#ttabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{dmTab=b.dataset.t;drawThreads();});
  const list=IDX.chats.filter(c=>(dmTab==='primary'?c.kind==='inbox':dmTab==='ai'?c.kind==='ai':c.kind==='message_requests'))
    .filter(c=>!q||chatName(c).toLowerCase().includes(q)||c.people.join(' ').toLowerCase().includes(q));
  $('#tlist').innerHTML=list.map(c=>{const l=c.last||{};const pv=l.text?((l.from===ME?'You: ':'')+l.text.split('\n')[0]):'';
    return `<a class="th${c.id===activeId?' on':''}" href="#/inbox/${encodeURIComponent(c.id)}">${avatar(chatName(c),56)}<div class="tx"><div class="nm">${esc(chatName(c))}</div><div class="pv">${esc(pv.slice(0,80))}${l.ts?` · ${ago(l.ts)}`:''}</div></div></a>`;}).join('')||'<div class="muted" style="padding:24px">No conversations.</div>';
}
let CH=null; // current chat state
async function openChat(id,focus){
  const box=$('#chat');box.dataset.id=id;
  const c=chatById[id];
  box.innerHTML=`<div class="hd"><a class="ic back-m" href="#/inbox" style="display:none">${I.back}</a>${avatar(c?chatName(c):id,44)}<div class="tt"><div><b>${esc(c?chatName(c):id)}</b></div><div class="small muted">${c?c.count.toLocaleString()+' messages':''}</div></div></div><div class="loading"><div class="spin"></div>Loading ${c?c.count.toLocaleString():''} messages…</div>`;
  let data;
  try{data=await getChat(id);}catch(e){box.querySelector('.loading').textContent='Could not load this chat.';return;}
  if(box.dataset.id!==id)return;
  const msgs=data.messages.filter(m=>!(m.text&&SYS_RE.test(m.text)));
  const map=[];data.messages.forEach((m,i)=>{if(!(m.text&&SYS_RE.test(m.text)))map[i]=map.length;});
  const people=others(c||data);
  const group=people.length>1;
  CH={id,c,msgs,start:0,end:0,group,origMap:map};
  box.innerHTML=`<div class="hd"><a class="ic" id="backm" href="#/inbox">${I.back}</a>${avatar(chatName(c),44)}<div class="tt"><div><b>${esc(chatName(c))}</b></div><div class="small muted">${group?esc(people.join(', ')):esc(people[0]||'')}</div></div>
    <button class="ic" title="Search in chat" id="bsearch">${I.search}</button><button class="ic" title="Jump to date" id="bdate">${I.cal}</button><button class="ic" title="Details" id="binfo">${I.info}</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">🙂<span style="flex:1">Message… (read-only archive)</span></div>
    <div class="drawer" id="drawer"></div>`;
  if(innerWidth>767)$('#backm').style.display='none';
  $('#binfo').onclick=()=>toggleDrawer('info');
  $('#bsearch').onclick=()=>toggleDrawer('search');
  $('#bdate').onclick=()=>toggleDrawer('date');
  const el=$('#msgs');
  let at=msgs.length-1;
  if(focus){
    if(focus.startsWith('src:')){const s=decodeURIComponent(focus.slice(4));const k=msgs.findIndex(m=>(m.media||[]).some(x=>x.src===s));if(k>=0)at=k;}
    else if(/^\d+$/.test(focus)){const k=map[+focus];if(k!=null)at=k;}
  }
  renderWindow(Math.max(0,at-120),Math.min(msgs.length,at+80));
  if(focus)scrollToMsg(at);else el.scrollTop=el.scrollHeight;
  el.onscroll=()=>{
    if(el.scrollTop<400&&CH.start>0){const h=el.scrollHeight;renderWindow(Math.max(0,CH.start-150),CH.end);el.scrollTop+=el.scrollHeight-h;}
    else if(el.scrollTop+el.clientHeight>el.scrollHeight-400&&CH.end<msgs.length){renderWindow(CH.start,Math.min(msgs.length,CH.end+150));}
  };
  el.addEventListener('click',e=>{
    const im=e.target.closest('[data-m]');if(!im)return;
    const list=[];let idx=0;
    msgs.forEach((m,mi)=>(m.media||[]).forEach(x=>{if(x.type!=='audio'){if(mi===+im.dataset.m&&x.src===im.dataset.src)idx=list.length;list.push({...x,from:m.from,ts:m.ts});}}));
    openLB(list,idx);
  });
}
function scrollToMsg(i){
  const el=$('#msgs');
  if(i<CH.start||i>=CH.end)renderWindow(Math.max(0,i-120),Math.min(CH.msgs.length,i+80));
  requestAnimationFrame(()=>{const t=el.querySelector(`[data-mi="${i}"]`);if(t){t.scrollIntoView({block:'center'});t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),1700);}});
}
function renderWindow(s,e){
  if(!$("#msgs"))return;
  CH.start=s;CH.end=e;
  const {msgs,group,c}=CH;const out=[];
  if(s===0)out.push(`<div class="intro">${avatar(chatName(c),96)}<h3 style="font-size:20px">${esc(chatName(c))}</h3><div class="muted">${esc(others(c).join(', '))}</div><div class="muted small" style="margin-top:6px">${msgs.length.toLocaleString()} messages${msgs[0]&&msgs[0].ts?' since '+fmtDay(msgs[0].ts):''}</div></div>`);
  else out.push(`<div class="loading" style="padding:20px"><div class="spin"></div></div>`);
  for(let i=s;i<e;i++){
    const m=msgs[i],p=msgs[i-1],n=msgs[i+1];
    const gap=!p||!m.ts||!p.ts||(new Date(m.ts)-new Date(p.ts))>36e5;
    if(gap&&m.ts)out.push(`<div class="ts">${fmtStamp(m.ts)}</div>`);
    const t=m.text||'';
    if(CALL_RE.test(t)&&!m.media){out.push(`<div class="sys" data-mi="${i}"><span>${/video/i.test(t)?I.video.replace('<svg','<svg width="16" height="16"'):I.phone.replace('<svg','<svg width="16" height="16"')}${esc(t.replace(/^.*? (started|missed|joined)/,(x,v)=>(m.from===ME?'You ':m.from+' ')+v).replace(/^call ended$/i,'Call ended'))} · ${fmtTime(m.ts)}</span></div>`);continue;}
    const me=m.from===ME;
    const same=(a)=>a&&a.from===m.from&&!(CALL_RE.test(a.text||'')&&!a.media)&&a.ts&&m.ts&&Math.abs(new Date(a.ts)-new Date(m.ts))<36e5;
    const first=!same(p)||gap, last=!same(n)||(n&&n.ts&&m.ts&&(new Date(n.ts)-new Date(m.ts))>36e5);
    let body='';
    const attachTxt=/sent an attachment\.$/.test(t);
    if(m.media)m.media.forEach(x=>{
      if(x.type==='img')body+=`<img class="mimg" data-m="${i}" data-src="${esc(x.src)}" ${msrc(x.src)} loading="lazy" alt="">`;
      else if(x.type==='video')body+=`<video class="mvid" ${msrc(x.src)} controls preload="metadata" playsinline></video>`;
      else body+=`<audio ${msrc(x.src)} controls preload="none"></audio>`;
    });
    if(m.share){const sh=m.share;const gif=/giphy\.com|\.gif(\?|$)/i.test(sh.url);
      body+=`<a class="share" href="${esc(sh.url)}" target="_blank" rel="noopener noreferrer">${sh.owner?`<div class="sh">${avatar(sh.owner,24)}${esc(sh.owner)}</div>`:''}
        <div class="sb${gif?' gif':''}">${gif?`<img src="${esc(sh.url)}" loading="lazy" alt="GIF">`:esc((sh.title||'').slice(0,220))||(/\/reel\//.test(sh.url)?'Reel':/\/stories\//.test(sh.url)?'Story':'Post')}</div>
        <div class="sf">${/\/reel\//.test(sh.url)?'Reel':/\/stories\//.test(sh.url)?'Story':gif?'GIF':'Post'} · Open on Instagram</div></a>`;}
    if(t&&!(attachTxt&&(m.share||m.media)))body+=attachTxt?`<div class="bubble unav">${esc(t)}</div>`:`<div class="bubble${isEmojiOnly(t)?' emoji':''}">${linkify(t)}</div>`;
    if(!body)body=`<div class="bubble unav">${m.from?'Message unavailable':''}</div>`;
    let reacts='';
    if(m.reactions&&m.reactions.length){
      const ems=m.reactions.map(r=>{const g=graphemes(r);return {e:g[0],who:g.slice(1).join('')};});
      const uniq=[...new Set(ems.map(x=>x.e))];
      reacts=`<div class="reacts" title="${esc(ems.map(x=>x.e+' '+(x.who===ME?'You':x.who)).join('\n'))}">${uniq.map(x=>`<span>${esc(x)}</span>`).join('')}${ems.length>1?`<span class="n">${ems.length}</span>`:''}</div>`;
    }
    out.push(`<div class="row${me?' me':''}${first?' first':''}${last?' last':''}" data-mi="${i}">
      ${me?`<span class="mtime">${fmtTime(m.ts)}</span>`:`<div class="av">${last?avatar(m.from||chatName(c),28):''}</div>`}
      <div class="bwrap">${group&&!me&&first?`<div class="sender">${esc(m.from)}</div>`:''}${body}${reacts}</div>
      ${me?'':`<span class="mtime">${fmtTime(m.ts)}</span>`}</div>`);
  }
  if(e<msgs.length)out.push(`<div class="loading" style="padding:20px"><div class="spin"></div></div>`);
  $('#msgs').innerHTML=out.join('');
}
function toggleDrawer(kind){
  const dr=$('#drawer');
  if(dr.classList.contains('open')&&dr.dataset.k===kind){dr.classList.remove('open');return;}
  dr.dataset.k=kind;dr.classList.add('open');

    const media=[];msgs.forEach((m,mi)=>(m.media||[]).forEach(x=>{if(x.type!=='audio')media.push({...x,from:m.from,ts:m.ts,mi});}));
    const aud=msgs.reduce((a,m)=>a+(m.media||[]).filter(x=>x.type==='audio').length,0);
    const shares=msgs.filter(m=>m.share).length;
    const by={};msgs.forEach(m=>{if(m.from)by[m.from]=(by[m.from]||0)+1;});

      <div class="sec" style="margin-top:0">Members</div>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0">${avatar(p,36)}<div style="flex:1">${esc(p===ME?p+' (You)':p)}</div><span class="small muted">${n.toLocaleString()}</span></div>`).join('')}
      <div class="sec">Stats</div><div class="small muted">${media.filter(x=>x.type==='img').length} photos · ${media.filter(x=>x.type==='video').length} videos · ${aud} voice messages · ${shares} shared posts</div>
      <div class="sec">Photos and videos</div><div id="dmedia"></div></div>`;
    const list=media.slice().reverse();
    if(list.length)infiniteGrid($('#dmedia'),list,(w,i)=>`<div class="tile" data-i="${i}">${w.type==='video'?`<video ${msrc(w.src,1)} preload="metadata" muted></video><div class="badge">▶</div>`:`<img ${msrc(w.src)} loading="lazy">`}</div>`,30,i=>openLB(list,i));
    else $('#dmedia').innerHTML='<div class="small muted">None</div>';
  }else if(kind==='search'){
    dr.innerHTML=`<div class="dh">Search${close}</div><div style="padding:12px 16px 0"><div class="searchbox"><input id="cq" placeholder="Search in conversation"></div></div><div class="db" id="cres"></div>`;
    const inp=$('#cq');inp.focus();let t;
    inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{const q=inp.value.trim().toLowerCase();const r=$('#cres');if(q.length<2){r.innerHTML='';return;}
      const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      const hits=[];msgs.forEach((m,i)=>{if(m.text&&m.text.toLowerCase().includes(q))hits.push(i);});
      r.innerHTML=`<div class="small muted" style="margin-bottom:8px">${hits.length.toLocaleString()} results</div>`+hits.slice(-500).reverse().map(i=>`<div class="res" data-j="${i}"><div class="small muted">${esc(msgs[i].from===ME?'You':msgs[i].from)} · ${fmtStamp(msgs[i].ts)}</div><div>${esc(msgs[i].text.slice(0,200)).replace(re,s=>`<mark>${s}</mark>`)}</div></div>`).join('');
      r.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{scrollToMsg(+x.dataset.j);if(innerWidth<768)dr.classList.remove('open');});},250);};
  }else{
    const months=[];let last='';msgs.forEach((m,i)=>{if(!m.ts)return;const k=m.ts.slice(0,7);if(k!==last){months.push([k,i,0]);last=k;}months[months.length-1][2]++;});
    dr.innerHTML=`<div class="dh">Jump to date${close}</div><div class="db"><input type="date" id="jd" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:12px" min="${(msgs[0]&&msgs[0].ts||'').slice(0,10)}" max="${(msgs[msgs.length-1]&&msgs[msgs.length-1].ts||'').slice(0,10)}">
      ${months.reverse().map(([k,i,n])=>`<div class="res" data-j="${i}" style="display:flex;justify-content:space-between"><span>${MONTHS[+k.slice(5)-1]} ${k.slice(0,4)}</span><span class="muted small">${n.toLocaleString()} messages</span></div>`).join('')}</div>`;
    $('#jd').onchange=e=>{const v=e.target.value;const i=msgs.findIndex(m=>m.ts&&m.ts.slice(0,10)>=v);if(i>=0)scrollToMsg(i);};
    dr.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{scrollToMsg(+x.dataset.j);if(innerWidth<768)dr.classList.remove('open');});
  }
  $('#dclose').onclick=()=>dr.classList.remove('open');
}

function renderVal(v){
  if(v==null||v==='')return '';
  if(typeof v==='string')return /^https?:\/\//.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>`:esc(v);
  if(v.link){if(v.link.startsWith('your_instagram_activity/messages/'))return `<span>${esc(v.text||v.link)}</span>`;return `<a href="${esc(/^https?:/.test(v.link)?v.link:mediaSrc(v.link))}" target="_blank" rel="noopener noreferrer">${esc(v.text||v.link)}</a>`;}
  if(v.media)return `<div class="gmedia">${v.media.map(m=>m.type==='video'?`<video ${msrc(m.src)} controls></video>`:m.type==='audio'?`<audio ${msrc(m.src)} controls></audio>`:`<img ${msrc(m.src)} data-lb="${esc(m.src)}">`).join('')}</div>`;
  if(v.rows)return v.rows.map(([k,val])=>typeof val==='object'&&val&&(val.blocks||val.rows)?`<div class="gblock">${k?`<div class="gt">${esc(k)}</div>`:''}${renderVal(val)}</div>`:`<div class="kv"><div class="k">${esc(k)}</div><div class="v">${renderVal(val)}</div></div>`).join('');
  if(v.blocks){
    if(v.blocks.every(b=>typeof b.value==='string'&&!b.title))return `<div class="v">${v.blocks.map(b=>esc(b.value)).join(', ')}</div>`;
    return v.blocks.map(renderBlock).join('');
  }
  return '';
}
function renderBlock(b){
  const inner=renderVal(b.value);
  if(!b.title&&!b.date&&b.value&&b.value.blocks&&b.value.blocks.length===1)return inner;
  return `<div class="gblock">${b.title?`<div class="gt">${b.href&&b.href.includes('/messages/')?`<a class="lnk" href="#/inbox/${encodeURIComponent(b.href.split('/').slice(-2,-1)[0])}">${esc(b.title)}</a>`:esc(b.title)}</div>`:''}${inner}${b.date?`<div class="gdate">${esc(b.date)}</div>`:''}</div>`;
}

  main.innerHTML=`<div class="center" style="max-width:720px"><h2 style="font-size:24px;margin-bottom:6px">Your activity</h2><div class="muted">One place to review what you've done on Instagram.</div>
    ${links.map(([g,arr])=>`<div class="sec">${g}</div><div class="plist">${arr.filter(([p])=>PAGES[p]).map(([p,l])=>`<a href="#/page/${encodeURIComponent(p)}"><span>${l}</span><span class="muted small">${PAGES[p].blocks.length} ›</span></a>`).join('')}</div>`).join('')}
    <div class="sec">Everything else</div><div class="plist"><a href="#/data"><span>All information in your export</span><span class="muted">›</span></a></div></div>`;
}

// ---------------- router
function route(){
  const h=location.hash.replace(/^#\/?/,'');const parts=h.split('/');
  const v=parts[0]||'home';
  main.onscroll=null;
  if(v!=='inbox'){main.dataset.view=v;}
  let active=v;
  if(v==='home'||v==='')viewHome();
  else if(v==='explore')viewExplore();
  else if(v==='reels')viewReels();
  else if(v==='inbox'){const id=parts[1]?decodeURIComponent(parts[1]):null;const focus=parts.slice(2).join('/')||null;viewInbox(id,focus);main.dataset.view='inbox';}
  else if(v==='profile')viewProfile(parts[1]);
  else if(v==='saved'){parts[1]!=null?viewSaved(+parts[1]):(profTab='saved',viewProfile('saved'));active='profile';}
  else if(v==='data')viewData(parts[1]);
  else if(v==='page')viewPage(decodeURIComponent(parts.slice(1).join('/')));
  else if(v==='activity')viewActivity();
  else viewHome();
  if(panelKind)active=panelKind;
  renderNav(active);
  if(v!=='inbox')main.scrollTop=0;
}
// ---------------- boot
function signInScreen(msg){
  $('#nav').style.display='none';
  main.innerHTML=`<div class="signin"><div class="word">Instagram</div>
    <div class="muted">Your archive, read privately from your Google Drive.</div>
    ${msg?`<div style="color:#ed4956">${msg}</div>`:''}
    <button class="btn" id="gsign" style="padding:10px">Sign in with Google</button>
    <details style="text-align:left"><summary class="muted small" style="cursor:pointer">Use a different Drive folder</summary>
      <input id="gfold" style="width:100%;margin-top:8px" placeholder="Paste Drive folder link" value="${esc(ls.get('ig-folder')?'https://drive.google.com/drive/folders/'+ls.get('ig-folder'):'')}"></details>
    <div class="muted small">Only you can read the files: access uses your own Google sign-in and is read-only.</div></div>`;
  $('#gsign').onclick=async()=>{
    const f=$('#gfold').value.trim();if(f){const id=parseFolder(f);if(!id){signInScreen('That is not a Drive folder link.');return;}ls.set('ig-folder',id);}
    try{await requestToken(true);start();}catch(e){signInScreen('Sign-in was cancelled or blocked. Allow pop-ups and try again.');}
  };
}
let started=false;
async function start(){
  $('#nav').style.display='';
  main.innerHTML='<div class="loading"><div class="spin"></div><span id="bootmsg">Opening your Drive folder…</span></div>';
  try{
    if(!LOCAL)await findRoots();
    $('#bootmsg').textContent='Loading your chats…';
    const [idx,pages]=await Promise.all([loadData('index','viewer_data/index.js'),loadData('pages','viewer_data/pages.js')]);
    IDX=idx;PAGES=pages||{};ME=IDX.owner||'';
    IDX.generated=IDX.chats.reduce((a,c)=>c.last&&c.last.ts&&c.last.ts>a?c.last.ts:a,'')||IDX.generated;
    IDX.chats.forEach(c=>chatById[c.id]=c);
  }catch(e){
    if(e.message==='NO_VIEWER_DATA')signInScreen('The <b>viewer_data</b> folder was not found in this Drive folder. Upload it next to <b>your_instagram_activity</b>.');
    else if(/Drive 40[34]|Not found/.test(e.message))signInScreen('Could not open the Drive folder. Make sure you signed in with the Google account that owns it.');
    else signInScreen('Something went wrong: '+esc(e.message));
    return;
  }
  if(!started){started=true;window.addEventListener('hashchange',()=>{if(panelKind){panel.classList.remove('open');panelKind=null;}closeLB();route();});}
  route();
}
if(LOCAL||(token&&tokenExp>Date.now()+60e3))start();
else if(CONFIG.CLIENT_ID.startsWith('PASTE_'))signInScreen('Setup needed: paste your OAuth Client ID into CONFIG at the top of the script.');
else signInScreen('');

})();
</script>
